<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taj Mahal - CSS 42</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #e0f2fe;
            padding: 40px;
        }

        h1 {
            color: #075985;
            text-align: center;
        }

        .breadcrumb {
            background: white;
            padding: 18px 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px #94a3b8;
            max-width: 700px;
            margin: 50px auto;
        }

        .breadcrumb a {
            color: #075985;
            text-decoration: none;
        }

        .breadcrumb a:hover {
            text-decoration: underline;
        }

        .separator {
            margin: 0 12px;
            color: #64748b;
        }

        .current {
            color: #d97706;
            font-weight: bold;
        }
    </style>
</head>

<body>

<h1>TAJ MAHAL</h1>

<div class="breadcrumb">
    <a href="#">Home</a>
    <span class="separator">›</span>

    <a href="#">Ancient Cities</a>
    <span class="separator">›</span>

    <a href="#">Temples</a>
    <span class="separator">›</span>

    <span class="current">Lost Temple</span>
</div>

</body>
</html>
