<!DOCTYPE html>
<html>
<head>
<title>Taj Mahal - Charts</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Arial;background:#eaf8ff;padding:25px;color:#063b4c}
.chart{max-width:700px;margin:auto;background:white;padding:25px;border-radius:15px}
.row{display:flex;align-items:center;margin:15px 0;gap:10px}
.label{width:100px}
.bar{flex:1;background:#d5edf4;border-radius:8px}
.fill{height:30px;background:#075b73;border-radius:8px}
@media(max-width:500px){.label{width:70px;font-size:13px}}
</style>
</head>

<body>

<div class="chart">
<h1>📈 Island Data</h1>

<div class="row"><span class="label">Students</span><div class="bar"><div class="fill" style="width:90%"></div></div></div>
<div class="row"><span class="label">Courses</span><div class="bar"><div class="fill" style="width:65%"></div></div></div>
<div class="row"><span class="label">Research</span><div class="bar"><div class="fill" style="width:80%"></div></div></div>
<div class="row"><span class="label">Events</span><div class="bar"><div class="fill" style="width:50%"></div></div></div>

</div>

</body>
</html>
