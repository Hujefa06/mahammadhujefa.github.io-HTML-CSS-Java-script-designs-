<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Multi Agent Workflow</title>
<style>
body{margin:0;background:#ecfeff;font-family:Arial;color:#164e63}
header{background:#0e7490;color:white;text-align:center;padding:25px}
.container{max-width:950px;margin:40px auto}
.agents{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.agent{background:white;padding:25px;border-radius:15px;text-align:center;box-shadow:0 4px 15px #0002}
.agent strong{display:block;color:#0284c7;font-size:20px}
@media(max-width:700px){.agents{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>🏛️ Multi-Agent Workflow</h1></header>
<div class="container">
<h2>Active Agents</h2>
<div class="agents">
<div class="agent"><strong>Research Agent</strong><p>Collecting data</p></div>
<div class="agent"><strong>Analysis Agent</strong><p>Processing results</p></div>
<div class="agent"><strong>Report Agent</strong><p>Preparing report</p></div>
</div>
</div>
</body>
</html>
