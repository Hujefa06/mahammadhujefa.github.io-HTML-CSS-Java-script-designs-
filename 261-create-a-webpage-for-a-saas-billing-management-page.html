<!DOCTYPE html>
<html>
<head>
<title>Taj Mahal - Billing</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;padding:30px;font-family:Arial;background:#eaf8ff;color:#063b4c}
.billing{max-width:900px;margin:auto}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{background:white;padding:25px;border-radius:15px;box-shadow:0 5px 15px #b5d9e5}
.amount{font-size:32px;font-weight:bold;color:#075b73}
table{width:100%;margin-top:25px;background:white;border-collapse:collapse}
th,td{padding:14px;border-bottom:1px solid #c5e2e9;text-align:left}
th{background:#075b73;color:white}
@media(max-width:700px){.cards{grid-template-columns:1fr}.table{overflow:auto}table{min-width:500px}}
</style>
</head>

<body>

<div class="billing">

<h1>💳 Billing Dashboard</h1>

<div class="cards">
<div class="card"><h3>Current Plan</h3><div class="amount">Pro</div></div>
<div class="card"><h3>Monthly Cost</h3><div class="amount">₹599</div></div>
<div class="card"><h3>Next Billing</h3><div class="amount">25 Sep</div></div>
</div>

<table>
<tr><th>Invoice</th><th>Date</th><th>Amount</th></tr>
<tr><td>#KK101</td><td>25 Aug</td><td>₹599</td></tr>
<tr><td>#KK102</td><td>25 Jul</td><td>₹599</td></tr>
</table>

</div>

</body>
</html>
