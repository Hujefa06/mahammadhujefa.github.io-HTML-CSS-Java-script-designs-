<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taj Mahal - CSS 48</title>

    <style>
        body {
            font-family: Arial;
            background: #e0f2fe;
        }

        .product {
            width: 320px;
            margin: 70px auto;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 25px #94a3b8;
        }

        .image {
            height: 190px;
            background: #075985;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
        }

        .details {
            padding: 25px;
        }

        h1 {
            color: #075985;
        }

        .price {
            font-size: 25px;
            font-weight: bold;
            color: #d97706;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #075985;
            color: white;
            border: 0;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="product">

    <div class="image">
        ANCIENT MAP
    </div>

    <div class="details">

        <h1>Taj Map</h1>

        <p>Illustrated map of the ancient southern land.</p>

        <p class="price">₹799</p>

        <button>View Product</button>

    </div>

</div>

</body>
</html>
