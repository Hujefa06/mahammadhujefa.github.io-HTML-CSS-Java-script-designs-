<!DOCTYPE html>
<html>
<head>
    <title>Taj Mahal - Palindrome</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #eaf8ff;
            color: #063b4c;
            text-align: center;
            padding: 50px;
        }

        .card {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 5px 15px #b5d9e5;
        }

        h1 {
            color: #075b73;
        }

        #result {
            font-size: 23px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="card">
    <h1>🏛️ Ancient Palindrome</h1>
    <p>Number: 1221</p>
    <p id="result"></p>
</div>

<script>
    let number = 1221;
    let original = number;
    let reversed = 0;

    while (number > 0) {
        let digit = number % 10;
        reversed = reversed * 10 + digit;
        number = Math.floor(number / 10);
    }

    document.getElementById("result").textContent =
        original === reversed
        ? original + " is a Palindrome."
        : original + " is not a Palindrome.";
</script>

</body>
</html>
