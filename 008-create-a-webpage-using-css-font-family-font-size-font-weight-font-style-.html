<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Taj Mahal - CSS 08</title>

    <style>

        body {
            background-color: #f0f9ff;
            text-align: center;
        }

        h1 {
            font-family: Georgia, serif;
            font-size: 45px;
            font-weight: bold;
        }

        .ancient {
            font-family: "Times New Roman", serif;
            font-size: 24px;
            font-style: italic;
        }

        .strong {
            font-family: Arial, sans-serif;
            font-size: 22px;
            font-weight: 700;
        }

        .small {
            font-family: Arial;
            font-size: 18px;
            font-variant: small-caps;
        }

    </style>
</head>

<body>

    <h1>Taj Mahal</h1>

    <p class="ancient">
        Ancient stories speak of a lost southern land.
    </p>

    <p class="strong">
        Mughal Cenotaph and Ancient Cities
    </p>

    <p class="small">
        underwater ruins
    </p>

</body>
</html>
