<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Taj Mahal - CSS 28</title>

    <style>
        html {
            font-size: 16px;
        }

        body {
            margin: 0;
            font-family: Arial;
            background: #f0f9ff;
            text-align: center;
        }

        h1 {
            font-size: 5vw;
            color: #075985;
        }

        .em-box {
            width: 20em;
            padding: 2em;
            margin: 2em auto;
            background: #bae6fd;
        }

        .rem-box {
            width: 20rem;
            padding: 2rem;
            margin: 2rem auto;
            background: #bbf7d0;
        }

        .vh-box {
            height: 20vh;
            padding: 20px;
            background: #fef3c7;
        }

        .percent-box {
            width: 60%;
            padding: 20px;
            margin: 20px auto;
            background: #ddd6fe;
        }
    </style>
</head>

<body>

    <h1>TAJ MAHAL</h1>

    <div class="em-box">
        EM Units
    </div>

    <div class="rem-box">
        REM Units
    </div>

    <div class="vh-box">
        VH Units
    </div>

    <div class="percent-box">
        Percentage Units
    </div>

</body>
</html>
