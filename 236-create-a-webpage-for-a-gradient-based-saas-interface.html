<!DOCTYPE html>
<html>
<head>
<title>Taj Mahal - Gradient Interface</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    font-family:Arial;
    background:#eaf8ff;
    color:#063b4c;
}

.hero{
    min-height:70vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:white;
    background:linear-gradient(135deg,#063b4c,#075b73,#39a9c2);
}

.hero h1{
    font-size:clamp(2.5rem,8vw,5rem);
}

.card{
    max-width:700px;
    margin:-60px auto 40px;
    position:relative;
    background:white;
    padding:30px;
    border-radius:18px;
    box-shadow:0 10px 25px #9ccbd8;
}
</style>
</head>

<body>

<section class="hero">
<div>
<h1>🏛️ Taj Mahal</h1>
<p>The Lost Island</p>
</div>
</section>

<div class="card">
<h2>Explore the Ocean</h2>
<p>Discover the ancient world through a modern interface.</p>
</div>

</body>
</html>
