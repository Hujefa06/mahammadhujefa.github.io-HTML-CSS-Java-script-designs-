<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Team Management</title>
<style>
body{margin:0;background:#e0f2fe;font-family:Arial;color:#164e63}
header{background:#0369a1;color:white;text-align:center;padding:25px}
.team{max-width:900px;margin:40px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.member{background:white;padding:25px;border-radius:15px;box-shadow:0 4px 15px #0002;text-align:center}
.avatar{font-size:40px}
@media(max-width:700px){.team{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>🏛️ Team Management</h1></header>
<div class="team">
<div class="member"><div class="avatar">👩</div><h3>Meera</h3><p>Administrator</p></div>
<div class="member"><div class="avatar">👨</div><h3>Arun</h3><p>Developer</p></div>
<div class="member"><div class="avatar">👩</div><h3>Kavi</h3><p>Designer</p></div>
</div>
</body>
</html>
