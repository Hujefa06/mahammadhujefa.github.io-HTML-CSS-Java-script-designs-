<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taj Mahal - Ask Your Data</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #e3f8fc;
}

.container {
    width: 750px;
    max-width: 90%;
    margin: 50px auto;
}

h1 {
    color: #075985;
}

.question {
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 6px 18px #9bcbd5;
}

input {
    width: 100%;
    box-sizing: border-box;
    padding: 14px;
    border: 2px solid #70aebe;
    border-radius: 9px;
}

button {
    margin-top: 15px;
    padding: 11px 22px;
    border: none;
    border-radius: 8px;
    background: #087f8c;
    color: white;
}

.answer {
    margin-top: 20px;
    padding: 20px;
    background: #e2f5f8;
    border-radius: 9px;
}

.number {
    font-size: 32px;
    font-weight: bold;
    color: #075985;
}
</style>
</head>

<body>

<div class="container">
    <h1>Ask Your Taj Data</h1>

    <div class="question">
        <input type="text" placeholder="How many ancient sites were discovered?">
        <button>ASK DATA</button>

        <div class="answer">
            <p>AI found:</p>
            <div class="number">86 Sites</div>
        </div>
    </div>
</div>

</body>
</html>
