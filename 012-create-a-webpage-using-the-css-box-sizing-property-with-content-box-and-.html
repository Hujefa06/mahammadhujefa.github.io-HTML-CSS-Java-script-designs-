<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Taj Mahal - CSS 12</title>

    <style>

        body {
            font-family: Arial;
            background-color: #f0f9ff;
            text-align: center;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        .box {
            width: 250px;
            height: 180px;
            padding: 30px;
            border: 10px solid #075985;
            background-color: #bae6fd;
        }

        .content-box {
            box-sizing: content-box;
        }

        .border-box {
            box-sizing: border-box;
        }

    </style>
</head>

<body>

    <h1>CSS Box Sizing</h1>

    <div class="container">

        <div class="box content-box">
            <h2>Content-Box</h2>
            <p>Padding and border are added to the width.</p>
        </div>

        <div class="box border-box">
            <h2>Border-Box</h2>
            <p>Padding and border are included in the width.</p>
        </div>

    </div>

</body>
</html>
