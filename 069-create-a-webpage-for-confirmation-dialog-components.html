<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taj Mahal - CSS 69</title>

    <style>
        body {
            font-family: Arial;
            background: #e0f2fe;
            text-align: center;
            padding-top: 70px;
        }

        h1 {
            color: #075985;
        }

        .dialog {
            width: 360px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px #64748b;
        }

        .icon {
            font-size: 45px;
        }

        h2 {
            color: #075985;
        }

        .buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 25px;
        }

        button {
            padding: 12px 22px;
            border-radius: 7px;
            cursor: pointer;
        }

        .cancel {
            background: white;
            border: 2px solid #64748b;
        }

        .confirm {
            background: #dc2626;
            border: 2px solid #dc2626;
            color: white;
        }
    </style>
</head>

<body>

<h1>TAJ MAHAL</h1>

<div class="dialog">

    <div class="icon">⚠️</div>

    <h2>Delete Archive?</h2>

    <p>
        Are you sure you want to delete this ancient record?
    </p>

    <div class="buttons">
        <button class="cancel">Cancel</button>
        <button class="confirm">Delete</button>
    </div>

</div>

</body>
