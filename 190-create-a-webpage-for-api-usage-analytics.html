<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>API Usage Analytics</title>
<style>
body{margin:0;background:#effcff;font-family:Arial;color:#164e63}
header{background:#0369a1;color:white;text-align:center;padding:25px}
.grid{max-width:900px;margin:40px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{background:white;padding:25px;border-radius:15px;box-shadow:0 4px 15px #0002}
.value{font-size:32px;color:#0284c7;font-weight:bold}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>🏛️ API Usage Analytics</h1></header>
<div class="grid">
<div class="card"><h3>Total Requests</h3><div class="value">48,920</div></div>
<div class="card"><h3>Success Rate</h3><div class="value">98.7%</div></div>
<div class="card"><h3>Average Response</h3><div class="value">142 ms</div></div>
</div>
</body>
</html>
