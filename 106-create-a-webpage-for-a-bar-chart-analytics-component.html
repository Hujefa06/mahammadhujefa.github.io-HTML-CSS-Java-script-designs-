<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taj Mahal - Bar Chart</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #e3f8fc;
}

header {
    background: #075985;
    color: white;
    padding: 20px;
}

.chart {
    width: 80%;
    max-width: 700px;
    height: 350px;
    margin: 35px auto;
    background: white;
    padding: 25px;
    display: flex;
    align-items: end;
    justify-content: space-around;
    box-shadow: 0 5px 15px #9bcbd5;
}

.bar {
    width: 55px;
    background: #0e7490;
    border-radius: 7px 7px 0 0;
}

.a { height: 130px; }
.b { height: 220px; }
.c { height: 170px; }
.d { height: 280px; }
</style>
</head>

<body>
<header>
    <h1>Taj Mahal Site Analytics</h1>
</header>

<div class="chart">
    <div class="bar a"></div>
    <div class="bar b"></div>
    <div class="bar c"></div>
    <div class="bar d"></div>
</div>
</body>
</html>
