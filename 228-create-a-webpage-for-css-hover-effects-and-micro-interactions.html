<!DOCTYPE html>
<html>
<head>
<title>Taj Mahal - Hover Effects</title>

<style>
body{font-family:Arial;background:#eaf8ff;text-align:center;padding:40px;color:#063b4c}
.cards{display:flex;justify-content:center;gap:25px;flex-wrap:wrap}
.card{background:white;padding:35px;border-radius:15px;transition:.3s;box-shadow:0 5px 15px #b5d9e5}
.card:hover{transform:translateY(-10px) scale(1.03)}
button{padding:13px 25px;background:#075b73;color:white;border:0;border-radius:8px;transition:.3s}
button:hover{transform:scale(1.1);background:#063b4c}
</style>
</head>

<body>

<h1>🏛️ Island Interactions</h1>

<div class="cards">
<div class="card">🏝️<h2>Island</h2></div>
<div class="card">🏛️<h2>Ocean</h2></div>
<div class="card">🧭<h2>Explore</h2></div>
</div>

<br><button>Discover</button>

</body>
</html>
