<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taj Mahal - AI Confidence</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #dff6ff;
}

.card {
    width: 450px;
    max-width: 90%;
    margin: 70px auto;
    padding: 30px;
    background: white;
    border-radius: 15px;
    box-shadow: 0 7px 20px #9bcbd5;
}

h1 {
    color: #075985;
}

.score {
    text-align: center;
    font-size: 50px;
    color: #087f8c;
    font-weight: bold;
}

.progress {
    height: 18px;
    background: #cce8ed;
    border-radius: 10px;
    overflow: hidden;
}

.fill {
    width: 91%;
    height: 100%;
    background: #0e7490;
}

.label {
    text-align: center;
    margin-top: 12px;
    color: #41636d;
}
</style>
</head>

<body>

<div class="card">
    <h1>AI Confidence Score</h1>

    <div class="score">91%</div>

    <div class="progress">
        <div class="fill"></div>
    </div>

    <div class="label">
        High confidence prediction
    </div>
</div>

</body>
</html>
