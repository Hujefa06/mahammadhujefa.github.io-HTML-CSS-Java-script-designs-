<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Taj Mahal - CSS 16</title>

    <style>

        body {
            font-family: Arial;
            background-color: #f0f9ff;
            text-align: center;
        }

        .card {
            background-color: #bae6fd;
            padding: 25px;
            margin: 20px auto;
            width: 300px;
            border-radius: 20px;
        }

        .circle {
            width: 150px;
            height: 150px;
            background-color: #0f766e;
            border-radius: 50%;
            margin: 30px auto;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pill {
            display: inline-block;
            background-color: #d97706;
            color: white;
            padding: 12px 30px;
            border-radius: 50px;
        }

        .shape {
            width: 200px;
            height: 100px;
            background-color: #7c3aed;
            margin: 30px auto;
            border-radius: 50% 10% 50% 10%;
        }

    </style>
</head>

<body>

    <h1>Taj Mahal</h1>

    <div class="card">
        Ancient Temple Card
    </div>

    <div class="circle">
        Island
    </div>

    <div class="pill">
        Ancient Ruins
    </div>

    <div class="shape"></div>

</body>
</html>
