<!DOCTYPE html>
<html>
<head>
<title>Taj Mahal - Sliding Card</title>

<style>
body{font-family:Arial;background:#eaf8ff;text-align:center;padding:40px;color:#063b4c}
.card{width:300px;margin:auto;background:white;border-radius:16px;padding:30px;overflow:hidden;position:relative;box-shadow:0 5px 15px #b5d9e5}
.card::after{content:"Explore Taj Mahal";position:absolute;left:-100%;right:0;bottom:0;background:#075b73;color:white;padding:15px;transition:.5s}
.card:hover::after{left:0}
</style>
</head>

<body>

<h1>🏛️ Sliding Card</h1>

<div class="card">
<h2>Ancient Island</h2>
<p>Hover over this card.</p>
</div>

</body>
</html>
