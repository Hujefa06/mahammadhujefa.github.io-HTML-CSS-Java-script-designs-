<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taj Mahal - CSS 57</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #e0f2fe;
        }

        .hero {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px;
            background: linear-gradient(135deg, #075985, #0e7490);
            color: white;
        }

        .hero-content {
            max-width: 700px;
        }

        h1 {
            font-size: clamp(40px, 7vw, 75px);
            margin: 0;
        }

        p {
            font-size: 20px;
            line-height: 1.6;
        }

        button {
            padding: 15px 30px;
            border: 0;
            border-radius: 30px;
            background: #fef3c7;
            color: #075985;
            font-weight: bold;
        }
    </style>
</head>

<body>

<section class="hero">

    <div class="hero-content">

        <h1>TAJ MAHAL</h1>

        <p>
            Explore ancient cities, forgotten temples
            and stories on the banks of the sacred Yamuna.
        </p>

        <button>BEGIN EXPLORATION</button>

    </div>

</section>

</body>
</html>
