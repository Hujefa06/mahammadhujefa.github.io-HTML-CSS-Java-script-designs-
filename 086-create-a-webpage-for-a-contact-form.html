<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taj Mahal - Contact</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #e0f7ff;
}

.contact {
    width: 400px;
    max-width: 90%;
    margin: 60px auto;
    padding: 30px;
    background: white;
    border-radius: 15px;
    box-shadow: 0 8px 25px #8bbdcc;
}

h1 {
    text-align: center;
    color: #075985;
}

input, textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 11px;
    margin: 8px 0;
    border: 1px solid #70aebe;
    border-radius: 7px;
}

textarea {
    height: 120px;
    resize: vertical;
}

button {
    width: 100%;
    padding: 11px;
    background: #087f8c;
    color: white;
    border: none;
    border-radius: 7px;
}
</style>
</head>

<body>
<div class="contact">
    <h1>Contact the Explorers</h1>

    <input type="text" placeholder="Your Name">
    <input type="email" placeholder="Your Email">
    <textarea placeholder="Your Message"></textarea>

    <button>SEND MESSAGE</button>
</div>
</body>
</html>
