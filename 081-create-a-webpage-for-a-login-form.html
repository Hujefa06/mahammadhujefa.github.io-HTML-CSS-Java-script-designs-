<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taj Mahal - Login Form</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #dff6ff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.login {
    width: 320px;
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 8px 25px #8bbdcc;
}

h1 {
    text-align: center;
    color: #075985;
}

label {
    display: block;
    margin-top: 15px;
    color: #164e63;
}

input {
    width: 100%;
    padding: 10px;
    margin-top: 6px;
    box-sizing: border-box;
    border: 1px solid #67a9bd;
    border-radius: 7px;
}

button {
    width: 100%;
    margin-top: 20px;
    padding: 11px;
    border: none;
    border-radius: 7px;
    background: #087f8c;
    color: white;
    cursor: pointer;
}
</style>
</head>

<body>
<div class="login">
    <h1>Taj Login</h1>

    <label>Email</label>
    <input type="email" placeholder="Enter email">

    <label>Password</label>
    <input type="password" placeholder="Enter password">

    <button>LOGIN</button>
</div>
</body>
</html>
