<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Trigger Action Workflow</title>
<style>
body{margin:0;background:#effcff;font-family:Arial;color:#164e63}
header{background:#0369a1;color:white;text-align:center;padding:25px}
.container{max-width:700px;margin:50px auto}
.box{background:white;padding:25px;margin:20px 0;border-radius:15px;box-shadow:0 4px 15px #0002}
.trigger{border-left:6px solid #f59e0b}
.action{border-left:6px solid #10b981}
</style>
</head>
<body>
<header><h1>🏛️ Trigger → Action</h1></header>
<div class="container">
<div class="box trigger"><h2>⚡ Trigger</h2><p>New student registration occurs.</p></div>
<div class="box action"><h2>🚀 Action</h2><p>Send a welcome notification.</p></div>
</div>
</body>
</html>
