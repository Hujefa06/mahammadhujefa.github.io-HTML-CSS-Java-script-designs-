<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taj Mahal - CSS 49</title>

    <style>
        body {
            font-family: Arial;
            background: #e0f2fe;
            padding: 50px;
        }

        h1 {
            text-align: center;
            color: #075985;
        }

        .features {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .feature {
            width: 250px;
            padding: 25px;
            background: white;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 8px 20px #94a3b8;
        }

        .icon {
            font-size: 40px;
        }

        .feature h2 {
            color: #075985;
        }
    </style>
</head>

<body>

<h1>TAJ MAHAL</h1>

<div class="features">

    <div class="feature">
        <div class="icon">🏛️</div>
        <h2>Ocean</h2>
        <p>Explore the sacred Yamuna.</p>
    </div>

    <div class="feature">
        <div class="icon">🏛️</div>
        <h2>Temples</h2>
        <p>Discover ancient structures.</p>
    </div>

    <div class="feature">
        <div class="icon">🗺️</div>
        <h2>Maps</h2>
        <p>Study ancient landscapes.</p>
    </div>

</div>

</body>
</html>
