<!DOCTYPE html>
<html lang="en">
<head>

<title>Taj Mahal - AI Content</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #e3f8fc;
}

.card {
    width: 650px;
    max-width: 90%;
    margin: 50px auto;
    padding: 30px;
    background: white;
    border-radius: 15px;
    box-shadow: 0 6px 18px #9bcbd5;

    background: #075985;
    color: white;

    border-radius: 15px;

}

.content {
    padding: 20px;
    background: #eefafd;
    border-radius: 10px;
    line-height: 1.7;
}

.meta {
    margin-top: 20px;
    color: #52737b;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="card">
    <span class="badge">AI GENERATED</span>

    <h1>The Crown of Palaces</h1>

    <div class="content">
        An exploration of ancient landscapes, coastal settlements
        and stories connected with Taj Mahal.
    </div>

    <div class="meta">
        Generated content • Taj AI
    </div>
</div>

</body>
</html>
