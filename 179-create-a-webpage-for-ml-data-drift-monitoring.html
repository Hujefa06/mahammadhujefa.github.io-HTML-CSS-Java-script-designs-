<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ML Data Drift</title>
<style>
body{margin:0;background:#e0f2fe;font-family:Arial;color:#164e63}
header{background:#0369a1;color:white;text-align:center;padding:25px}
.card{max-width:750px;margin:50px auto;background:white;padding:30px;border-radius:16px;box-shadow:0 4px 15px #0002}
.bar{height:20px;background:#dbeafe;border-radius:20px;margin:12px 0 25px}
.fill{height:100%;border-radius:20px;background:#0284c7}
.low{width:25%}.medium{width:52%}.high{width:78%}
</style>
</head>
<body>
<header><h1>🏛️ Data Drift Monitor</h1></header>
<div class="card">
<h2>Feature Drift</h2>
<p>Temperature</p><div class="bar"><div class="fill low"></div></div>
<p>Humidity</p><div class="bar"><div class="fill medium"></div></div>
<p>Pressure</p><div class="bar"><div class="fill high"></div></div>
</div>
</body>
</html>
