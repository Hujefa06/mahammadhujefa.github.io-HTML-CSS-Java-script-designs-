<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Human in the Loop</title>
<style>
body{margin:0;background:#eff6ff;font-family:Arial;color:#1e3a5f}
header{background:#075985;color:white;text-align:center;padding:25px}
.workflow{max-width:900px;margin:50px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{background:white;padding:25px;border-radius:15px;text-align:center;box-shadow:0 4px 15px #0002}
@media(max-width:700px){.workflow{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>🏛️ Human + AI Workflow</h1></header>
<div class="workflow">
<div class="card"><h2>🤖 AI</h2><p>Generates a recommendation.</p></div>
<div class="card"><h2>👤 Human</h2><p>Reviews the recommendation.</p></div>
<div class="card"><h2>✅ Decision</h2><p>Approved action is executed.</p></div>
</div>
</body>
</html>
