<!DOCTYPE html>
<html>
<head>
<title>Taj Mahal - Date and Math</title>
<style>
body{margin:0;font-family:Arial;background:#eaf8ff;color:#063b4c;text-align:center;padding:50px}
.card{max-width:600px;margin:auto;background:white;padding:35px;border-radius:16px;box-shadow:0 5px 15px #b5d9e5}
.item{background:#eaf8ff;padding:12px;margin:10px;border-radius:8px}
h1{color:#075b73}
</style>
</head>
<body>

<div class="card">
<h1>🧭 Island Date & Math</h1>

<div class="item" id="date"></div>
<div class="item" id="random"></div>
<div class="item" id="round"></div>
<div class="item" id="sqrt"></div>
</div>

<script>
let today = new Date();

document.getElementById("date").textContent =
    "Current Date: " + today.toLocaleDateString();

document.getElementById("random").textContent =
    "Random Number: " + Math.floor(Math.random() * 100);

document.getElementById("round").textContent =
    "Rounded Value: " + Math.round(45.67);

document.getElementById("sqrt").textContent =
    "Square Root of 81: " + Math.sqrt(81);
</script>

</body>
</html>
