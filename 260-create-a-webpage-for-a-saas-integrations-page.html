<!DOCTYPE html>
<html>
<head>
<title>Taj Mahal - Integrations</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;padding:30px;font-family:Arial;background:#eaf8ff;color:#063b4c}
.integrations{max-width:1000px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.integration{background:white;padding:25px;border-radius:15px;box-shadow:0 5px 15px #b5d9e5}
.icon{font-size:40px}
button{padding:10px 20px;background:#075b73;color:white;border:0;border-radius:7px}
@media(max-width:750px){.integrations{grid-template-columns:1fr 1fr}}
@media(max-width:500px){.integrations{grid-template-columns:1fr}}
</style>
</head>

<body>

<h1>🔗 Island Integrations</h1>

<div class="integrations">

<div class="integration">
<div class="icon">📊</div>
<h2>Analytics</h2>
<p>Connect analytics tools.</p>
<button>Connect</button>
</div>

<div class="integration">
<div class="icon">☁️</div>
<h2>Cloud Storage</h2>
<p>Store island data.</p>
<button>Connect</button>
</div>

<div class="integration">
<div class="icon">💬</div>
<h2>Communication</h2>
<p>Connect team messaging.</p>
<button>Connect</button>
</div>

</div>

</body>
</html>
