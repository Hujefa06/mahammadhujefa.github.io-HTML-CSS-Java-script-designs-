<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Agent Permissions</title>
<style>
body{margin:0;background:#ecfeff;font-family:Arial;color:#164e63}
header{background:#0e7490;color:white;text-align:center;padding:25px}
.box{max-width:750px;margin:40px auto;background:white;padding:25px;border-radius:15px;box-shadow:0 4px 15px #0002}
.permission{display:flex;justify-content:space-between;padding:18px;border-bottom:1px solid #cffafe}
.badge{background:#bae6fd;color:#075985;padding:6px 12px;border-radius:20px}
</style>
</head>
<body>
<header><h1>🏛️ Agent Permissions</h1></header>
<div class="box">
<h2>Permissions Management</h2>
<div class="permission"><span>Read Data</span><span class="badge">Allowed</span></div>
<div class="permission"><span>Write Data</span><span class="badge">Allowed</span></div>
<div class="permission"><span>Delete Data</span><span class="badge">Restricted</span></div>
<div class="permission"><span>External API Access</span><span class="badge">Allowed</span></div>
</div>
</body>
</html>
