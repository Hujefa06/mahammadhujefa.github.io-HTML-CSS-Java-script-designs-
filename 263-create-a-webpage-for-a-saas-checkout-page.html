<!DOCTYPE html>
<html>
<head>
<title>Taj Mahal - Checkout</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;padding:30px;font-family:Arial;background:#eaf8ff;color:#063b4c}
.checkout{max-width:900px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:25px}
.box{background:white;padding:25px;border-radius:15px;box-shadow:0 5px 15px #b5d9e5}
input{width:100%;padding:12px;margin:7px 0 15px;box-sizing:border-box;border:1px solid #9bcbd8;border-radius:7px}
button{width:100%;padding:13px;background:#075b73;color:white;border:0;border-radius:8px}
@media(max-width:700px){.checkout{grid-template-columns:1fr}}
</style>
</head>

<body>

<h1>🏛️ Complete Your Journey</h1>

<div class="checkout">

<div class="box">
<h2>Payment Details</h2>

<label>Name</label>
<input type="text">

<label>Card Number</label>
<input type="text">

<label>Expiry</label>
<input type="text">

<label>CVV</label>
<input type="password">

<button>Pay Now</button>
</div>

<div class="box">
<h2>Order Summary</h2>
<p>Navigator Plan</p>
<hr>
<h2>Total: ₹599</h2>
<p>✓ Island Analytics</p>
<p>✓ Research Tools</p>
<p>✓ AI Features</p>
</div>

</div>

</body>
</html>
