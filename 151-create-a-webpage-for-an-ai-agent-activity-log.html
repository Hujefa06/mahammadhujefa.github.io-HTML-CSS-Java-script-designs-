<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taj Mahal - Agent Activity Log</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #e3f8fc;
}

.log {
    width: 700px;
    max-width: 90%;
    margin: 50px auto;
}

h1 {
    color: #075985;
}

.entry {
    display: flex;
    gap: 20px;
    padding: 18px;
    margin: 10px 0;
    background: white;
    border-left: 4px solid #087f8c;
    border-radius: 8px;
    box-shadow: 0 3px 10px #b8d9df;
}

.time {
    color: #087f8c;
    font-weight: bold;
}

.message {
    color: #164e63;
}
</style>
</head>

<body>

<div class="log">
    <h1>AI Agent Activity Log</h1>

    <div class="entry">
        <div class="time">10:42</div>
        <div class="message">Research Agent started site analysis.</div>
    </div>

    <div class="entry">
        <div class="time">10:47</div>
        <div class="message">Data Agent processed 2,450 records.</div>
    </div>

    <div class="entry">
        <div class="time">10:51</div>
        <div class="message">Report Agent completed a research report.</div>
    </div>

</div>

</body>
</html>
