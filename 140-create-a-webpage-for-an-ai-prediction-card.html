<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taj Mahal - AI Prediction</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #dff6ff;
}

.card {
    width: 500px;
    max-width: 90%;
    margin: 70px auto;
    padding: 30px;
    background: white;
    border-radius: 15px;
    box-shadow: 0 7px 20px #9bcbd5;
}

h1 {
    color: #075985;
}

.prediction {
    padding: 25px;
    background: #e3f6f9;
    border-radius: 12px;
    text-align: center;
}

.percent {
    font-size: 48px;
    font-weight: bold;
    color: #087f8c;
}

.progress {
    height: 16px;
    background: #cce7ec;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 15px;
}

.fill {
    width: 82%;
    height: 100%;
    background: #0e7490;
}

.label {
    margin-top: 15px;
    color: #41636d;
}
</style>
</head>

<body>

<div class="card">
    <h1>AI Prediction</h1>

    <div class="prediction">
        <div class="percent">82%</div>
        <h2>High Research Interest</h2>

        <div class="progress">
            <div class="fill"></div>
        </div>

        <div class="label">
            Predicted engagement level
        </div>
    </div>
</div>

</body>
</html>
