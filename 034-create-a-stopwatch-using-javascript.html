<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INSCRIPTION 34 — Taj Mahal</title><link rel="stylesheet" href="../assets/theme.css"></head><body><div class="top"><a href="index.html">TAJ MAHAL · JAVASCRIPT</a></div><main class="workPage"><div class="wrap"><a class="back" href="index.html">← RETURN TO HALL</a><div class="workHead"><div class="insNo">INSCRIPTION 34</div></div><div class="practicalFrame"><div class="frameTop">JAVASCRIPT · INSCRIPTION 34</div><div class="liveBody"><iframe title="Working JavaScript practical" srcdoc="&lt;!doctype html&gt;&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width,initial-scale=1&quot;&gt;&lt;title&gt;Create a stopwatch using JavaScript.&lt;/title&gt;&lt;style&gt;body{font-family:Arial;margin:24px;background:#f5f0e5;color:#182b30}*{box-sizing:border-box}button,input,select,textarea{padding:9px;margin:5px;border:1px solid #9a7639;border-radius:6px}button{cursor:pointer;background:#173b42;color:white}.box{padding:18px;border:2px solid #9a7639;background:#fffdf8;border-radius:12px;margin:12px 0}.out{margin-top:12px;padding:14px;background:white;border-left:4px solid #9a7639;min-height:32px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{padding:15px;background:white;border:1px solid #d5c8aa;border-radius:12px}&lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;h1&gt;Stopwatch&lt;/h1&gt;&lt;div id=&quot;out&quot; class=&quot;out&quot;&gt;0.0 s&lt;/div&gt;&lt;button onclick=&quot;start()&quot;&gt;Start&lt;/button&gt;&lt;button onclick=&quot;stop()&quot;&gt;Stop&lt;/button&gt;&lt;button onclick=&quot;reset()&quot;&gt;Reset&lt;/button&gt;&lt;script&gt;let t=0,id;function start(){if(!id)id=setInterval(()=&gt;{t+=.1;out.textContent=t.toFixed(1)+&quot; s&quot;},100)}function stop(){clearInterval(id);id=null}function reset(){stop();t=0;out.textContent=&quot
