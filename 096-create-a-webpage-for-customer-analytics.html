<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taj Mahal - Customer Analytics</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #e2f7fb;
}

h1 {
    margin: 0;
    padding: 20px;
    background: #075985;
    color: white;
}

.customers {
    padding: 25px;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    box-shadow: 0 5px 15px #9bcbd5;
}

th, td {
    padding: 15px;
    border-bottom: 1px solid #b8dbe2;
    text-align: left;
}

th {
    background: #0e7490;
    color: white;
}

td:nth-child(3) {
    color: #087f8c;
    font-weight: bold;
}
</style>
</head>

<body>
<h1>Taj Mahal Customer Analytics</h1>

<div class="customers">
<table>
    <tr>
        <th>Customer</th>
        <th>Visits</th>
        <th>Engagement</th>
    </tr>
    <tr>
        <td>Arun</td>
        <td>12</td>
        <td>High</td>
    </tr>
    <tr>
        <td>Meera</td>
        <td>8</td>
        <td>Medium</td>
    </tr>
    <tr>
        <td>Kavin</td>
        <td>15</td>
        <td>High</td>
    </tr>
</table>
</div>
</body>
</html>
