<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taj Mahal - CSS 70</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #e0f2fe;
        }

        h1 {
            text-align: center;
            color: #075985;
            padding: 60px;
        }

        .drawer {
            position: fixed;
            top: 0;
            right: 0;
            width: 320px;
            height: 100vh;
            background: #082f49;
            color: white;
            padding: 30px;
            box-sizing: border-box;
            box-shadow: -10px 0 25px #64748b;
        }

        .drawer h2 {
            color: #bae6fd;
        }

        .drawer a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 15px 0;
            border-bottom: 1px solid #155e75;
        }
    </style>
</head>

<body>

<h1>TAJ MAHAL</h1>

<div class="drawer">

    <h2>EXPLORE</h2>

    <a href="#">Ancient Cities</a>
    <a href="#">Temples</a>
    <a href="#">Maps</a>
    <a href="#">Ivory Marble Dome</a>

</div>

</body>
</html>
