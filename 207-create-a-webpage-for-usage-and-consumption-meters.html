<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Usage Meters</title>
<style>
body{margin:0;background:#e8f8ff;font-family:Arial;color:#164e63}
header{background:#075985;color:white;text-align:center;padding:25px}
.meters{max-width:700px;margin:45px auto;background:white;padding:30px;border-radius:16px;box-shadow:0 4px 15px #0002}
.meter{margin:25px 0}
.bar{height:20px;background:#dbeafe;border-radius:20px;overflow:hidden}
.fill{height:100%;background:#0284c7}
.api{width:72%}.storage{width:48%}.tokens{width:83%}
</style>
</head>
<body>
<header><h1>🏛️ Usage & Consumption</h1></header>
<div class="meters">
<div class="meter"><b>API Calls — 72%</b><div class="bar"><div class="fill api"></div></div></div>
<div class="meter"><b>Storage — 48%</b><div class="bar"><div class="fill storage"></div></div></div>
<div class="meter"><b>AI Tokens — 83%</b><div class="bar"><div class="fill tokens"></div></div></div>
</div>
</body>
</html>
