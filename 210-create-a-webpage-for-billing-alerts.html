<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Billing Alerts</title>
<style>
body{margin:0;background:#ecfeff;font-family:Arial;color:#164e63}
header{background:#0e7490;color:white;text-align:center;padding:25px}
.alerts{max-width:750px;margin:45px auto}
.alert{background:white;padding:22px;margin:15px 0;border-radius:13px;box-shadow:0 4px 15px #0002;border-left:6px solid #0284c7}
.warning{border-left-color:#f59e0b}
.success{border-left-color:#059669}
</style>
</head>
<body>
<header><h1>🏛️ Billing Alerts</h1></header>
<div class="alerts">
<div class="alert warning"><h3>⚠️ Spending Limit Warning</h3><p>80% of your monthly AI budget has been used.</p></div>
<div class="alert success"><h3>✓ Payment Successful</h3><p>Your latest subscription payment was successful.</p></div>
<div class="alert"><h3>🔔 Upcoming Payment</h3><p>Your next payment is scheduled for 20 Oct 2026.</p></div>
</div>
</body>
</html>
