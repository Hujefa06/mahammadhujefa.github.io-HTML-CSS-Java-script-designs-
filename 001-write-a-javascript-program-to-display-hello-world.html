<!DOCTYPE html>
<html>
<head>
    <title>Taj Mahal - Hello World</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eaf8ff;
            color: #063b4c;
            text-align: center;
            padding: 60px 20px;
        }

        .card {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 5px 15px #b5d9e5;
        }

        h1 {
            color: #075b73;
        }
    </style>
</head>

<body>

<div class="card">
    <h1>🏛️ Taj Mahal</h1>
    <p id="message"></p>
</div>

<script>
    document.getElementById("message").textContent = "Hello World!";
</script>

</body>
</html>
