<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Agent Configuration</title>
<style>
body{margin:0;background:#f0f9ff;font-family:Arial;color:#164e63}
header{background:#075985;color:white;padding:25px;text-align:center}
.settings{max-width:700px;margin:40px auto;background:white;padding:30px;border-radius:15px;box-shadow:0 4px 15px #0002}
.setting{display:flex;justify-content:space-between;align-items:center;padding:18px 0;border-bottom:1px solid #bae6fd}
input{accent-color:#0284c7}
select{padding:8px;border-radius:7px;border:1px solid #7dd3fc}
</style>
</head>
<body>
<header><h1>🏛️ Agent Configuration</h1></header>
<div class="settings">
<h2>Configuration Settings</h2>
<div class="setting"><span>Automatic Execution</span><input type="checkbox" checked></div>
<div class="setting"><span>Response Logging</span><input type="checkbox" checked></div>
<div class="setting"><span>Notifications</span><input type="checkbox"></div>
<div class="setting"><span>Execution Mode</span><select><option>Balanced</option><option>Fast</option><option>Detailed</option></select></div>
</div>
</body>
</html>
