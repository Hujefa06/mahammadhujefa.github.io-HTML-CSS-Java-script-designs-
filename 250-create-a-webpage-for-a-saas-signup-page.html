<!DOCTYPE html>
<html>
<head>
<title>Taj Mahal - SaaS Signup</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    padding:30px;
    font-family:Arial;
    background:#eaf8ff;
}

.signup{
    max-width:500px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:18px;
    box-shadow:0 5px 20px #b5d9e5;
}

input{
    width:100%;
    padding:13px;
    margin:7px 0 15px;
    box-sizing:border-box;
    border:1px solid #9bcbd8;
    border-radius:8px;
}

button{
    width:100%;
    padding:13px;
    background:#075b73;
    color:white;
    border:0;
    border-radius:8px;
}
</style>
</head>

<body>

<div class="signup">

<h1>🏛️ Join Taj Mahal</h1>

<label>Name</label>
<input type="text">

<label>Email</label>
<input type="email">

<label>Password</label>
<input type="password">

<label>Confirm Password</label>
<input type="password">

<button>Create Account</button>

</div>

</body>
</html>
