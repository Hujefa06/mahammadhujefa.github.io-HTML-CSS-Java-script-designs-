<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>User Management</title>
<style>
body{margin:0;background:#effcff;font-family:Arial;color:#164e63}
header{background:#075985;color:white;text-align:center;padding:25px}
table{width:90%;max-width:900px;margin:40px auto;background:white;border-collapse:collapse;box-shadow:0 4px 15px #0002}
th,td{padding:16px;border-bottom:1px solid #bae6fd;text-align:left}
th{background:#e0f2fe;color:#075985}
.active{color:#059669;font-weight:bold}
</style>
</head>
<body>
<header><h1>🏛️ User Management</h1></header>
<table>
<tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th></tr>
<tr><td>Meera</td><td>meera@example.com</td><td>Admin</td><td class="active">Active</td></tr>
<tr><td>Arun</td><td>arun@example.com</td><td>Developer</td><td class="active">Active</td></tr>
<tr><td>Kavi</td><td>kavi@example.com</td><td>User</td><td>Inactive</td></tr>
</table>
</body>
</html>
