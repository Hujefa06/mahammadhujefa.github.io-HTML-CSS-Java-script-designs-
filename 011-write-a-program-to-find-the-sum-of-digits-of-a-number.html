<!DOCTYPE html>
<html>
<head>
<title>Taj Mahal - Sum of Digits</title>
<style>
body{margin:0;font-family:Arial;background:#eaf8ff;color:#063b4c;text-align:center;padding:50px}
.card{max-width:500px;margin:auto;background:white;padding:35px;border-radius:16px;box-shadow:0 5px 15px #b5d9e5}
h1{color:#075b73}
#result{font-size:24px;font-weight:bold;color:#075b73}
</style>
</head>
<body>

<div class="card">
<h1>🏛️ Sum of Digits</h1>
<p>Number: 12345</p>
<p id="result"></p>
</div>

<script>
let number = 12345;
let temp = number;
let sum = 0;

while (temp > 0) {
    sum += temp % 10;
    temp = Math.floor(temp / 10);
}

document.getElementById("result").textContent =
    "Sum of digits = " + sum;
</script>

</body>
</html>
