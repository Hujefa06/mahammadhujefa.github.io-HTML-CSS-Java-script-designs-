<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taj Mahal - SaaS Dashboard</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #e5f7fb;
}

header {
    padding: 20px;
    background: #075985;
    color: white;
}

.dashboard {
    padding: 25px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 5px 15px #9bcbd5;
}

.card h2 {
    color: #087f8c;
}

@media(max-width:700px) {
    .dashboard {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>
<header>
    <h1>Taj Mahal Explorer Dashboard</h1>
</header>

<div class="dashboard">
    <div class="card">
        <h2>1,250</h2>
        <p>Explorers</p>
    </div>

    <div class="card">
        <h2>86</h2>
        <p>Ancient Sites</p>
    </div>

    <div class="card">
        <h2>42</h2>
        <p>Research Reports</p>
    </div>
</div>
</body>
</html>
