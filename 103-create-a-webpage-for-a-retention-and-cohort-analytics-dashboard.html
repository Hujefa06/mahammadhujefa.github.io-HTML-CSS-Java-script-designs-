<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taj Mahal - Cohort Analytics</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #e3f8fc;
}

header {
    background: #075985;
    color: white;
    padding: 20px;
}

.container {
    padding: 25px;
    overflow-x: auto;
}

table {
    width: 100%;
    min-width: 600px;
    border-collapse: collapse;
    background: white;
    box-shadow: 0 5px 15px #9bcbd5;
}

th, td {
    padding: 15px;
    text-align: center;
    border: 1px solid #b9dce4;
}

th {
    background: #0e7490;
    color: white;
}

.high {
    background: #b7e4ea;
}

.medium {
    background: #d8f0f4;
}

.low {
    background: #eef9fb;
}
</style>
</head>

<body>
<header>
    <h1>Explorer Retention & Cohort Analytics</h1>
</header>

<div class="container">
<table>
    <tr>
        <th>Cohort</th>
        <th>Month 1</th>
        <th>Month 2</th>
        <th>Month 3</th>
        <th>Month 4</th>
    </tr>
    <tr>
        <td>January</td>
        <td class="high">92%</td>
        <td class="high">81%</td>
        <td class="medium">70%</td>
        <td class="medium">65%</td>
    </tr>
    <tr>
        <td>February</td>
        <td class="high">90%</td>
        <td class="medium">76%</td>
        <td class="medium">68%</td>
        <td class="low">59%</td>
    </tr>
    <tr>
        <td>March</td>
        <td class="high">94%</td>
        <td class="high">83%</td>
        <td class="medium">72%</td>
        <td class="low">61%</td>
    </tr>
</table>
</div>
</body>
</html>
