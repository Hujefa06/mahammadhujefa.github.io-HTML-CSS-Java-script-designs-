<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Taj Mahal - CSS 34</title>

    <style>
        body {
            font-family: Arial;
            background: #e0f2fe;
            text-align: center;
            overflow: hidden;
        }

        h1 {
            color: #075985;
        }

        .ocean {
            position: relative;
            height: 350px;
            background: #075985;
            overflow: hidden;
        }

        .island {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #fef3c7;

            position: absolute;
            left: 0;
            top: 120px;

            animation: travel 5s infinite alternate ease-in-out;
        }

        @keyframes travel {
            0% {
                left: 0;
                transform: rotate(0deg);
            }

            50% {
                transform: rotate(180deg) scale(1.3);
            }

            100% {
                left: calc(100% - 100px);
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <h1>TAJ MAHAL</h1>

    <h2>CSS Keyframe Animation</h2>

    <div class="ocean">
        <div class="island"></div>
    </div>

</body>
</html>
