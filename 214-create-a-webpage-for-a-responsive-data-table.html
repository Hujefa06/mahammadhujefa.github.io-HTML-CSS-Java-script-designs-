<!DOCTYPE html>
<html>
<head>
<title>Taj Mahal - Data Table</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;font-family:Arial;background:#eaf8ff;color:#063b4c;padding:25px}
h1{text-align:center;color:#075b73}
.table-box{overflow-x:auto;background:white;padding:15px;border-radius:15px}
table{width:100%;border-collapse:collapse;min-width:600px}
th,td{padding:14px;border:1px solid #b5d9e5;text-align:left}
th{background:#075b73;color:white}
tr:nth-child(even){background:#f0fbff}
</style>
</head>

<body>
<h1>🏛️ Taj Mahal Students</h1>

<div class="table-box">
<table>
<tr><th>PRN</th><th>Name</th><th>Course</th><th>Year</th></tr>
<tr><td>KK101</td><td>Aran</td><td>Computing</td><td>2</td></tr>
<tr><td>KK102</td><td>Meena</td><td>Data Science</td><td>2</td></tr>
<tr><td>KK103</td><td>Velan</td><td>Cybersecurity</td><td>3</td></tr>
</table>
</div>

</body>
</html>
