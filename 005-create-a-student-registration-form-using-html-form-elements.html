<!DOCTYPE html>
<html>
<head>
    <title>Taj Mahal - HTML 5</title>
</head>
<body>

<h1>Taj Mahal</h1>

<h2>Explorer Registration</h2>

<form>

    <label>Name:</label>
    <input type="text" name="name">
    <br><br>

    <label>Email:</label>
    <input type="email" name="email">
    <br><br>

    <label>Password:</label>
    <input type="password" name="password">
    <br><br>

    <label>Age:</label>
    <input type="number" name="age">
    <br><br>

    <label>Gender:</label>

    <input type="radio" name="gender" value="male">
    Male

    <input type="radio" name="gender" value="female">
    Female

    <br><br>

    <label>Interest:</label>

    <select name="interest">
        <option>Ancient Temples</option>
        <option>Ivory Marble Dome</option>
        <option>Ancient Maps</option>
    </select>

    <br><br>

    <input type="submit" value="Register">
    <input type="reset" value="Reset">

</form>

</body>
</html>
