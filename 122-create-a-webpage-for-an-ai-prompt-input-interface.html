<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taj Mahal - AI Prompt</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #dff6ff;
}

.prompt-box {
    width: 650px;
    max-width: 90%;
    margin: 80px auto;
    padding: 30px;
    background: white;
    border-radius: 15px;
    box-shadow: 0 7px 20px #9bcbd5;
}

h1 {
    color: #075985;
}

textarea {
    width: 100%;
    height: 150px;
    box-sizing: border-box;
    padding: 15px;
    resize: none;
    border: 2px solid #70aebe;
    border-radius: 10px;
    font-size: 16px;
}

button {
    margin-top: 15px;
    padding: 12px 25px;
    border: none;
    border-radius: 8px;
    background: #087f8c;
    color: white;
}
</style>
</head>

<body>

<div class="prompt-box">
    <h1>Ask Taj AI</h1>

    <textarea placeholder="Enter your prompt..."></textarea>

    <button>GENERATE</button>
</div>

</body>
</html>
