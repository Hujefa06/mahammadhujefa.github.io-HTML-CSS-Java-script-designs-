<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taj Mahal - AI Summarizer</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #e3f8fc;
}

.container {
    width: 800px;
    max-width: 90%;
    margin: 40px auto;
}

h1 {
    color: #075985;
}

.panels {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.panel {
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 5px 15px #9bcbd5;
}

.panel h2 {
    color: #087f8c;
}

.document, .summary {
    min-height: 180px;
    padding: 15px;
    background: #eef9fb;
    border-radius: 8px;
    line-height: 1.6;
}

@media(max-width:700px) {
    .panels {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="container">
    <h1>AI Document Summarizer</h1>

    <div class="panels">

        <div class="panel">
            <h2>Document</h2>
            <div class="document">
                Taj Mahal research contains discussions
                about ancient southern landscapes and coastal
                settlements.
            </div>
        </div>

        <div class="panel">
            <h2>AI Summary</h2>
            <div class="summary">
                The document discusses ancient southern
                landscapes and coastal settlements.
            </div>
        </div>

    </div>
</div>

</body>
</html>
