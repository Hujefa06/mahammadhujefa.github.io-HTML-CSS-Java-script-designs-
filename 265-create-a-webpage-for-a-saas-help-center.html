<!DOCTYPE html>
<html>
<head>
<title>Taj Mahal - Help Center</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;font-family:Arial;background:#eaf8ff;color:#063b4c}
.hero{background:#075b73;color:white;text-align:center;padding:60px 20px}
.search{width:90%;max-width:600px;padding:16px;border:0;border-radius:10px}
.categories{max-width:900px;margin:30px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding:20px}
.card{background:white;padding:25px;border-radius:15px;box-shadow:0 5px 15px #b5d9e5}
@media(max-width:700px){.categories{grid-template-columns:1fr}}
</style>
</head>

<body>

<section class="hero">
<h1>🏛️ Taj Mahal Help Center</h1>
<p>How can we help you?</p>
<input class="search" placeholder="Search for answers...">
</section>

<div class="categories">
<div class="card"><h2>📚 Getting Started</h2><p>Learn the basics.</p></div>
<div class="card"><h2>⚙️ Account</h2><p>Manage your account.</p></div>
<div class="card"><h2>💬 Support</h2><p>Contact our team.</p></div>
</div>

</body>
</html>
