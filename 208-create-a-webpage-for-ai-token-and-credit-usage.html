<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI Token Usage</title>
<style>
body{margin:0;background:#effcff;font-family:Arial;color:#164e63}
header{background:#0369a1;color:white;text-align:center;padding:25px}
.dashboard{max-width:900px;margin:40px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{background:white;padding:25px;border-radius:15px;box-shadow:0 4px 15px #0002}
.value{font-size:32px;color:#0284c7;font-weight:bold}
@media(max-width:700px){.dashboard{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>🏛️ AI Token Usage</h1></header>
<div class="dashboard">
<div class="card"><h3>Tokens Used</h3><div class="value">82,450</div></div>
<div class="card"><h3>Credits Used</h3><div class="value">164</div></div>
<div class="card"><h3>Credits Left</h3><div class="value">336</div></div>
</div>
</body>
</html>
