<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taj Mahal - Natural Language Query</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #dff6ff;
}

.query {
    width: 700px;
    max-width: 90%;
    margin: 70px auto;
}

h1 {
    color: #075985;
}

.box {
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 6px 18px #9bcbd5;
}

textarea {
    width: 100%;
    box-sizing: border-box;
    height: 120px;
    padding: 15px;
    border: 2px solid #70aebe;
    border-radius: 10px;
}

button {
    margin-top: 15px;
    padding: 12px 25px;
    border: none;
    border-radius: 8px;
    background: #087f8c;
    color: white;
}

.answer {
    margin-top: 20px;
    padding: 20px;
    background: #e3f6f9;
    border-radius: 10px;
}
</style>
</head>

<body>

<div class="query">
    <h1>Ask Taj Data</h1>

    <div class="box">
        <textarea placeholder="Ask your question in natural language..."></textarea>

        <button>ASK AI</button>

        <div class="answer">
            <strong>AI Answer:</strong>
            86 research sites are currently recorded.
        </div>
    </div>
</div>

</body>
</html>
