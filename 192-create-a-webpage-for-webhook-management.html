<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Webhook Management</title>
<style>
body{margin:0;background:#ecfeff;font-family:Arial;color:#164e63}
header{background:#0e7490;color:white;text-align:center;padding:25px}
.container{max-width:900px;margin:40px auto}
.webhook{background:white;padding:25px;margin:15px 0;border-radius:15px;box-shadow:0 4px 15px #0002}
.url{background:#f0f9ff;padding:12px;border-radius:7px;overflow:auto}
.status{color:#059669;font-weight:bold}
button{padding:9px 18px;background:#0284c7;color:white;border:0;border-radius:7px}
</style>
</head>
<body>
<header><h1>🏛️ Webhook Management</h1></header>
<div class="container">
<div class="webhook">
<h3>Student Created</h3>
<div class="url">https://kumari.example.com/webhooks/student</div>
<p class="status">● Active</p>
<button>Edit</button>
</div>
<div class="webhook">
<h3>Marks Updated</h3>
<div class="url">https://kumari.example.com/webhooks/marks</div>
<p class="status">● Active</p>
<button>Edit</button>
</div>
</div>
</body>
</html>
