<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Profile Settings</title>
<style>
body{margin:0;background:#ecfeff;font-family:Arial;color:#164e63}
header{background:#0e7490;color:white;text-align:center;padding:25px}
.profile{max-width:650px;margin:45px auto;background:white;padding:30px;border-radius:18px;box-shadow:0 4px 15px #0002;text-align:center}
.avatar{width:90px;height:90px;border-radius:50%;background:#bae6fd;margin:auto;display:flex;align-items:center;justify-content:center;font-size:40px}
input{width:100%;padding:12px;margin:10px 0;border:1px solid #7dd3fc;border-radius:8px}
</style>
</head>
<body>
<header><h1>🏛️ Profile Settings</h1></header>
<div class="profile">
<div class="avatar">👤</div>
<h2>Ocean Explorer</h2>
<input placeholder="Display Name">
<input placeholder="Bio">
<input placeholder="Location">
</div>
</body>
</html>
