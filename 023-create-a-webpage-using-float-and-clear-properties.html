<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taj Mahal - CSS 23</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f9ff;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #075985;
        }

        .image {
            float: left;
            width: 180px;
            height: 150px;
            margin: 10px 20px 10px 0;
            background: #0e7490;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .text {
            background: #dbeafe;
            padding: 20px;
        }

        .clear {
            clear: both;
            background: #fef3c7;
            padding: 20px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <h1>TAJ MAHAL</h1>

    <div class="image">
        TEMPLE
    </div>

    <div class="text">
        <h2>Floating Element</h2>

        <p>
            This temple block uses the CSS float property.
            Text flows around the floated element.
        </p>
    </div>

    <div class="clear">
        <h2>Clear Property</h2>
        <p>
            This section uses clear: both and starts below the floated element.
        </p>
    </div>

</body>
</html>
