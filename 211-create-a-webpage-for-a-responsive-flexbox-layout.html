<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Responsive Flexbox</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#e8f8ff;font-family:Arial;color:#164e63}
header{background:#075985;color:white;text-align:center;padding:25px}
.flexbox{max-width:1000px;margin:50px auto;display:flex;gap:20px;flex-wrap:wrap;padding:20px}
.card{flex:1 1 250px;background:white;padding:35px;border-radius:15px;text-align:center;box-shadow:0 4px 15px #0002}
</style>
</head>
<body>
<header><h1>🏛️ Responsive Flexbox</h1></header>
<div class="flexbox">
<div class="card"><h2>🏛️ Ocean</h2><p>Flexible content block</p></div>
<div class="card"><h2>🏛️ Heritage</h2><p>Flexible content block</p></div>
<div class="card"><h2>🧭 Exploration</h2><p>Flexible content block</p></div>
</div>
</body>
</html>
