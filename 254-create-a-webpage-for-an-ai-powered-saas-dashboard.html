<!DOCTYPE html>
<html>
<head>
<title>Taj Mahal - AI Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;font-family:Arial;background:#eaf8ff;color:#063b4c}
header{background:#075b73;color:white;padding:25px;text-align:center}
.dashboard{padding:25px;display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{background:white;padding:25px;border-radius:16px;box-shadow:0 5px 15px #b5d9e5}
.ai{background:linear-gradient(135deg,#075b73,#1686a5);color:white}
.score{font-size:40px;font-weight:bold}
@media(max-width:800px){.dashboard{grid-template-columns:1fr 1fr}}
@media(max-width:500px){.dashboard{grid-template-columns:1fr}}
</style>
</head>

<body>

<header>
<h1>🤖 AI Taj Mahal</h1>
<p>Intelligent Island Dashboard</p>
</header>

<div class="dashboard">

<div class="card ai">
<h2>AI Insight</h2>
<p>Island activity is increasing.</p>
</div>

<div class="card">
<h2>Prediction</h2>
<div class="score">87%</div>
<p>Exploration activity</p>
</div>

<div class="card">
<h2>Recommendation</h2>
<p>Review the latest ocean research.</p>
</div>

<div class="card">
<h2>AI Tasks</h2>
<p>24 completed</p>
</div>

<div class="card">
<h2>Data Points</h2>
<p>18,450 analyzed</p>
</div>

<div class="card">
<h2>Confidence</h2>
<div class="score">94%</div>
</div>

</div>

</body>
</html>
