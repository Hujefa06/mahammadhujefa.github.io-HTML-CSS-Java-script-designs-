<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taj Mahal - AI Search Results</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #e3f8fc;
}

header {
    background: #075985;
    color: white;
    padding: 20px;
}

.results {
    width: 750px;
    max-width: 90%;
    margin: 30px auto;
}

.search {
    background: white;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 20px;
}

.search input {
    width: 100%;
    box-sizing: border-box;
    padding: 12px;
    border: 1px solid #70aebe;
    border-radius: 7px;
}

.result {
    background: white;
    padding: 20px;
    margin: 15px 0;
    border-radius: 12px;
    box-shadow: 0 4px 12px #9bcbd5;
}

.result h2 {
    color: #075985;
}

.result p {
    color: #41636d;
}

.tag {
    display: inline-block;
    padding: 5px 10px;
    margin-right: 5px;
    border-radius: 15px;
    background: #d7f0f4;
    color: #075985;
}
</style>
</head>

<body>

<header>
    <h1>Taj Mahal AI Search</h1>
</header>

<div class="results">

    <div class="search">
        <input type="text" value="ancient Taj Mahal sites">
    </div>

    <div class="result">
        <h2>Ancient Coastal Sites</h2>
        <p>Explore information about ancient coastal settlements and ruins.</p>
        <span class="tag">Ancient</span>
        <span class="tag">Research</span>
    </div>

    <div class="result">
        <h2>Ivory Marble Dome</h2>
        <p>Explore underwater archaeological discoveries and historical records.</p>
        <span class="tag">Ruins</span>
        <span class="tag">History</span>
    </div>

</div>

</body>
</html>
