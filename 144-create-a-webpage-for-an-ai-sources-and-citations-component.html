<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taj Mahal - AI Sources</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #e3f8fc;
}

.sources {
    width: 650px;
    max-width: 90%;
    margin: 50px auto;
    padding: 30px;
    background: white;
    border-radius: 15px;
    box-shadow: 0 6px 18px #9bcbd5;
}

h1 {
    color: #075985;
}

.source {
    padding: 18px;
    margin: 12px 0;
    background: #eef9fb;
    border-radius: 10px;
    border-left: 5px solid #087f8c;
}

.source h2 {
    color: #075985;
    font-size: 18px;
}

.source p {
    color: #41636d;
}

.badge {
    display: inline-block;
    padding: 5px 10px;
    background: #d4eef3;
    color: #075985;
    border-radius: 15px;
}
</style>
</head>

<body>

<div class="sources">
    <h1>AI Sources & Citations</h1>

    <div class="source">
        <span class="badge">SOURCE 01</span>
        <h2>Ancient Coastal Research</h2>
        <p>Reference information used to support the AI response.</p>
    </div>

    <div class="source">
        <span class="badge">SOURCE 02</span>
        <h2>Archaeological Records</h2>
        <p>Supporting material related to ancient sites.</p>
    </div>

</div>

</body>
</html>
