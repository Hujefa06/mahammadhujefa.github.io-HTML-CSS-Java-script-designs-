<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Taj Mahal - CSS 11</title>

    <style>

        body {
            font-family: Arial;
            background-color: #f0fdfa;
            text-align: center;
        }

        .land {
            width: 60%;
            height: 150px;

            min-width: 250px;
            max-width: 700px;

            min-height: 120px;
            max-height: 200px;

            margin: 40px auto;
            padding: 30px;

            background-color: #99f6e4;
            border: 4px solid #0f766e;

            overflow: auto;
        }

    </style>
</head>

<body>

    <h1>Taj Mahal</h1>

    <div class="land">

        <h2>Ancient Land</h2>

        <p>
            This box demonstrates width, height,
            minimum and maximum dimensions.
        </p>

    </div>

</body>
</html>
