<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taj Mahal - Conversion Funnel</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #e3f8fc;
}

header {
    background: #075985;
    color: white;
    padding: 20px;
}

.funnel {
    width: 70%;
    max-width: 650px;
    margin: 35px auto;
    text-align: center;
}

.stage {
    margin: 10px auto;
    padding: 18px;
    color: white;
    background: #0e7490;
    border-radius: 8px;
}

.stage:nth-child(1) { width: 100%; }
.stage:nth-child(2) { width: 80%; }
.stage:nth-child(3) { width: 60%; }
.stage:nth-child(4) { width: 40%; }
</style>
</head>

<body>
<header>
    <h1>Taj Mahal Conversion Funnel</h1>
</header>

<div class="funnel">
    <div class="stage">Visitors — 10,000</div>
    <div class="stage">Explorers — 8,000</div>
    <div class="stage">Registered — 6,000</div>
    <div class="stage">Members — 4,000</div>
</div>
</body>
</html>
