<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI Agent Workflow</title>
<style>
body{margin:0;background:#ecfeff;font-family:Arial;color:#164e63}
header{background:#0e7490;color:white;text-align:center;padding:25px}
.workflow{max-width:1000px;margin:50px auto;display:flex;gap:20px;align-items:center;justify-content:center;flex-wrap:wrap}
.step{background:white;padding:25px;width:180px;text-align:center;border-radius:15px;box-shadow:0 5px 15px #0002}
.step span{font-size:35px}.arrow{font-size:30px;color:#0891b2}
</style>
</head>
<body>
<header><h1>🏛️ Taj Mahal AI Workflow</h1></header>
<div class="workflow">
<div class="step"><span>📥</span><h3>Input</h3><p>Receive task</p></div>
<div class="arrow">→</div>
<div class="step"><span>🧠</span><h3>Process</h3><p>Analyze data</p></div>
<div class="arrow">→</div>
<div class="step"><span>⚙️</span><h3>Execute</h3><p>Perform action</p></div>
<div class="arrow">→</div>
<div class="step"><span>✅</span><h3>Output</h3><p>Return result</p></div>
</div>
</body>
</html>
