<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taj Mahal - CSS 47</title>

    <style>
        body {
            font-family: Arial;
            background: #e0f2fe;
            text-align: center;
            padding: 50px;
        }

        .profile {
            width: 300px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px #94a3b8;
        }

        .avatar {
            width: 110px;
            height: 110px;
            margin: auto;
            border-radius: 50%;
            background: #075985;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            font-weight: bold;
        }

        h1 {
            color: #075985;
        }

        .role {
            color: #64748b;
        }

        button {
            padding: 12px 25px;
            border: 0;
            border-radius: 25px;
            background: #075985;
            color: white;
        }
    </style>
</head>

<body>

<div class="profile">

    <div class="avatar">KK</div>

    <h1>Taj Explorer</h1>

    <p class="role">Ancient History Researcher</p>

    <p>
        Exploring stories and traditions of the crown of palaces.
    </p>

    <button>View Profile</button>

</div>

</body>
</html>
