<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taj Mahal - CSS 75</title>

    <style>
        body {
            font-family: Arial;
            background: #dcfce7;
            text-align: center;
            padding: 60px;
        }

        .success {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 45px;
            border-radius: 18px;
            box-shadow: 0 8px 25px #94a3b8;
        }

        .icon {
            width: 80px;
            height: 80px;
            margin: auto;
            border-radius: 50%;
            background: #16a34a;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
        }

        h1 {
            color: #15803d;
        }
    </style>
</head>

<body>

<div class="success">

    <div class="icon">✓</div>

    <h1>Archive Saved</h1>

    <p>
        The ancient record was successfully saved.
    </p>

</div>

</body>
</html>
