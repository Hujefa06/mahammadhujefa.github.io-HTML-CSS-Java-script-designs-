<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ML Forecast Chart</title>
<style>
body{margin:0;background:#f0f9ff;font-family:Arial;color:#164e63}
header{background:#0369a1;color:white;text-align:center;padding:25px}
.chart{max-width:800px;margin:50px auto;background:white;padding:30px;border-radius:15px;box-shadow:0 4px 15px #0002}
svg{width:100%;height:300px}
.line{fill:none;stroke:#0284c7;stroke-width:5}
.grid{stroke:#bae6fd;stroke-width:1}
</style>
</head>
<body>
<header><h1>🏛️ ML Forecast</h1></header>
<div class="chart">
<h2>Prediction Forecast</h2>
<svg viewBox="0 0 700 300">
<line class="grid" x1="50" y1="250" x2="680" y2="250"/>
<line class="grid" x1="50" y1="150" x2="680" y2="150"/>
<polyline class="line" points="50,220 150,190 250,205 350,130 450,150 550,90 650,110"/>
</svg>
</div>
</body>
</html>
