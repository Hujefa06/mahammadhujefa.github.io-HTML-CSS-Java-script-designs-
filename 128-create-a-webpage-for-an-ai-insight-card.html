<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taj Mahal - AI Insight</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #dff6ff;
}

.insight {
    width: 600px;
    max-width: 90%;
    margin: 60px auto;
    padding: 30px;
    background: white;
    border-radius: 15px;
    box-shadow: 0 6px 18px #9bcbd5;
    border-top: 6px solid #087f8c;
}

h1 {
    color: #075985;
}

.insight p {
    line-height: 1.7;
    color: #41636d;
}

.highlight {
    padding: 15px;
    background: #e0f5f8;
    border-radius: 8px;
    font-weight: bold;
    color: #075985;
}
</style>
</head>

<body>

<div class="insight">
    <h1>AI Insight</h1>

    <p>
        Research activity shows strong interest in ancient coastal
        settlements and underwater archaeological sites.
    </p>

    <div class="highlight">
        Key Insight: Coastal research is the most viewed topic.
    </div>
</div>

</body>
</html>
