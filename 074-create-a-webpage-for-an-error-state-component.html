<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taj Mahal - CSS 74</title>

    <style>
        body {
            font-family: Arial;
            background: #fee2e2;
            text-align: center;
            padding: 60px;
        }

        .error {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 45px;
            border-radius: 18px;
            box-shadow: 0 8px 25px #94a3b8;
        }

        .icon {
            font-size: 65px;
        }

        h1 {
            color: #b91c1c;
        }

        button {
            padding: 13px 25px;
            background: #b91c1c;
            color: white;
            border: 0;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="error">

    <div class="icon">⚠️</div>

    <h1>Archive Error</h1>

    <p>
        The ancient archive could not be loaded.
    </p>

    <button>Try Again</button>

</div>

</body>
</html>
