<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Organization Settings</title>
<style>
body{margin:0;background:#ecfeff;font-family:Arial;color:#164e63}
header{background:#0e7490;color:white;text-align:center;padding:25px}
.box{max-width:700px;margin:45px auto;background:white;padding:30px;border-radius:16px;box-shadow:0 4px 15px #0002}
label{display:block;font-weight:bold;margin-top:18px}
input,select{width:100%;padding:12px;margin-top:7px;border:1px solid #7dd3fc;border-radius:8px}
</style>
</head>
<body>
<header><h1>🏛️ Organization Settings</h1></header>
<div class="box">
<h2>Taj Mahal Research Group</h2>
<label>Organization Name</label>
<input value="Taj Mahal Research">
<label>Industry</label>
<select><option>Technology</option><option>Education</option><option>Research</option></select>
<label>Timezone</label>
<input value="IST (UTC+5:30)">
</div>
</body>
</html>
