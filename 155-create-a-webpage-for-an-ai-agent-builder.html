<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI Agent Builder</title>
<style>
body{margin:0;background:#e0f2fe;font-family:Arial;color:#0c4a6e}
header{background:#0369a1;color:white;padding:25px;text-align:center}
.builder{max-width:900px;margin:40px auto;background:white;padding:30px;border-radius:18px;box-shadow:0 5px 20px #0002}
label{display:block;margin:15px 0 6px;font-weight:bold}
input,select,textarea{width:100%;padding:12px;border:1px solid #7dd3fc;border-radius:8px}
button{margin-top:20px;padding:12px 25px;border:0;border-radius:8px;background:#0284c7;color:white}
</style>
</head>
<body>
<header><h1>🏛️ AI Agent Builder</h1></header>
<div class="builder">
<h2>Create Your Agent</h2>
<label>Agent Name</label>
<input type="text" placeholder="Enter agent name">
<label>Agent Type</label>
<select><option>Research Agent</option><option>Data Agent</option><option>Support Agent</option></select>
<label>Instructions</label>
<textarea rows="5" placeholder="Describe the agent..."></textarea>
<button>Create Agent</button>
</div>
</body>
</html>
