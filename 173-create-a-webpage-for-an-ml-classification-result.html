<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ML Classification Result</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#e8f8ff;color:#164e63}
header{background:#075985;color:white;text-align:center;padding:25px}
.card{max-width:600px;margin:60px auto;background:white;padding:35px;border-radius:18px;box-shadow:0 5px 18px #0002;text-align:center}
.result{font-size:45px;font-weight:bold;color:#0284c7;margin:20px}
.badge{display:inline-block;background:#bae6fd;color:#075985;padding:10px 20px;border-radius:25px}
</style>
</head>
<body>
<header><h1>🏛️ Taj Mahal ML</h1></header>
<div class="card">
<h2>Classification Result</h2>
<div class="result">Ocean</div>
<span class="badge">Confidence: 94%</span>
<p>The model classified the input successfully.</p>
</div>
</body>
</html>
