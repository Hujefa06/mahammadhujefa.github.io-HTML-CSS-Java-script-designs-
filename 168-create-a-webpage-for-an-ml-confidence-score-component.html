<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ML Confidence Score</title>
<style>
body{margin:0;background:#ecfeff;font-family:Arial;color:#164e63}
header{background:#0e7490;color:white;text-align:center;padding:25px}
.card{max-width:500px;margin:60px auto;background:white;padding:35px;text-align:center;border-radius:18px;box-shadow:0 5px 18px #0002}
.circle{width:170px;height:170px;border-radius:50%;border:18px solid #bae6fd;border-top-color:#0284c7;margin:20px auto;display:flex;align-items:center;justify-content:center;font-size:35px;font-weight:bold}
</style>
</head>
<body>
<header><h1>🏛️ ML Confidence</h1></header>
<div class="card">
<h2>Model Confidence</h2>
<div class="circle">92%</div>
<p>High confidence prediction</p>
</div>
</body>
</html>
