<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Prediction Comparison</title>
<style>
body{margin:0;background:#effcff;font-family:Arial;color:#164e63}
header{background:#0369a1;color:white;text-align:center;padding:25px}
.dashboard{max-width:900px;margin:40px auto;display:grid;grid-template-columns:repeat(2,1fr);gap:25px}
.card{background:white;padding:30px;border-radius:16px;box-shadow:0 4px 15px #0002}
.value{font-size:35px;color:#0284c7;font-weight:bold}
@media(max-width:650px){.dashboard{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>🏛️ Prediction Comparison</h1></header>
<div class="dashboard">
<div class="card">
<h2>Model A</h2>
<p>Prediction</p>
<div class="value">87%</div>
<p>Accuracy: 91%</p>
</div>
<div class="card">
<h2>Model B</h2>
<p>Prediction</p>
<div class="value">92%</div>
<p>Accuracy: 95%</p>
</div>
</div>
</body>
</html>
