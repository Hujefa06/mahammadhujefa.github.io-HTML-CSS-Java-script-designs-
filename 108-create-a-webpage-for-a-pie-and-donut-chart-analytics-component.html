<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taj Mahal - Pie and Donut Chart</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #e3f8fc;
}

header {
    background: #075985;
    color: white;
    padding: 20px;
}

.charts {
    display: flex;
    justify-content: center;
    gap: 60px;
    padding: 50px;
    flex-wrap: wrap;
}

.pie, .donut {
    width: 220px;
    height: 220px;
    border-radius: 50%;
}

.pie {
    background: conic-gradient(
        #075985 0 40%,
        #0e7490 40% 70%,
        #67b7c5 70% 100%
    );
}

.donut {
    background: conic-gradient(
        #087f8c 0 65%,
        #b8e7f0 65% 100%
    );
    display: flex;
    align-items: center;
    justify-content: center;
}

.donut::after {
    content: "65%";
    width: 110px;
    height: 110px;
    background: white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #075985;
    font-size: 25px;
    font-weight: bold;
}
</style>
</head>

<body>
<header>
    <h1>Taj Mahal Distribution Analytics</h1>
</header>

<div class="charts">
    <div class="pie"></div>
    <div class="donut"></div>
</div>
</body>
</html>
