<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taj Mahal - AI Assistant</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #e3f8fc;
}

.assistant {
    width: 600px;
    max-width: 90%;
    margin: 50px auto;
    background: white;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 5px 15px #9bcbd5;
}

header {
    background: #075985;
    color: white;
    padding: 20px;
}

.chat {
    padding: 25px;
}

.message {
    padding: 12px 15px;
    margin: 12px 0;
    border-radius: 12px;
    max-width: 75%;
}

.ai {
    background: #d7f0f4;
    color: #164e63;
}

.user {
    background: #087f8c;
    color: white;
    margin-left: auto;
}

.input {
    padding: 15px;
    border-top: 1px solid #cce4e9;
}

input {
    width: 100%;
    box-sizing: border-box;
    padding: 12px;
    border: 1px solid #70aebe;
    border-radius: 8px;
}
</style>
</head>

<body>
<div class="assistant">
    <header>
        <h1>Taj AI Assistant</h1>
    </header>

    <div class="chat">
        <div class="message ai">Hello! How can I help you explore Taj Mahal?</div>
        <div class="message user">Tell me about the ancient sites.</div>
        <div class="message ai">I can help you explore recorded information about ancient sites.</div>
    </div>

    <div class="input">
        <input type="text" placeholder="Ask the AI assistant...">
    </div>
</div>
</body>
</html>
