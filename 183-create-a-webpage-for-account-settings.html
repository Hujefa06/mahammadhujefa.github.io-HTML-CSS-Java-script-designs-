<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Account Settings</title>
<style>
body{margin:0;background:#e8f8ff;font-family:Arial;color:#164e63}
header{background:#075985;color:white;padding:25px;text-align:center}
.settings{max-width:700px;margin:40px auto;background:white;padding:30px;border-radius:16px;box-shadow:0 4px 15px #0002}
label{display:block;margin-top:18px;font-weight:bold}
input{width:100%;padding:12px;margin-top:7px;border:1px solid #7dd3fc;border-radius:8px}
button{margin-top:20px;padding:12px 25px;background:#0284c7;color:white;border:0;border-radius:8px}
</style>
</head>
<body>
<header><h1>🏛️ Account Settings</h1></header>
<div class="settings">
<h2>My Account</h2>
<label>Name</label><input value="Ocean Explorer">
<label>Email</label><input value="explorer@example.com">
<label>Language</label><input value="English">
<button>Save Changes</button>
</div>
</body>
</html>
