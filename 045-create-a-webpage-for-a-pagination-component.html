    <title>Taj Mahal - CSS 45</title>

    <style>
        body {
            font-family: Arial;
            background: #e0f2fe;
            text-align: center;

        h1 {
            color: #075985;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 60px;
        }

        .pagination a {
            padding: 12px 17px;
            background: white;
            color: #075985;
            text-decoration: none;
            border: 2px solid #bae6fd;
            border-radius: 7px;

        .pagination a:hover,
        .pagination .active {
            background: #075985;
            color: white;
        }
    </style>
</head>
