<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taj Mahal - CSS 63</title>

    <style>
        body {
            font-family: Arial;
            background: #f0f9ff;
            text-align: center;
            padding: 40px;
        }

        h1 {
            color: #075985;
        }

        .section {
            max-width: 650px;
            margin: 30px auto;
        }

        .solid {
            border-top: 3px solid #075985;
        }

        .dashed {
            border-top: 3px dashed #d97706;
        }

        .dotted {
            border-top: 3px dotted #15803d;
        }

        .double {
            border-top: 6px double #7c3aed;
        }

        .separator {
            margin: 30px auto;
            width: 70%;
        }
    </style>
</head>

<body>

<h1>TAJ MAHAL</h1>

<div class="section">
    <h2>Ancient Cities</h2>
    <p>Stories of cities remembered through tradition.</p>
</div>

<div class="separator solid"></div>

<div class="section">
    <h2>Ancient Temples</h2>
    <p>Temples form part of the remembered heritage.</p>
</div>

<div class="separator dashed"></div>

<div class="section">
    <h2>Ivory Marble Dome</h2>
    <p>Stories describe lands beneath the sea.</p>
</div>

<div class="separator dotted"></div>

<div class="section">
    <h2>Ancient Maps</h2>
</div>

<div class="separator double"></div>

</body>
</html>
