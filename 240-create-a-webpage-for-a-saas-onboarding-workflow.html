<!DOCTYPE html>
<html>
<head>
<title>Taj Mahal - Onboarding</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    padding:30px;
    font-family:Arial;
    background:#eaf8ff;
    color:#063b4c;
}

.workflow{
    max-width:800px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:16px;
}

.steps{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.step{
    flex:1;
    text-align:center;
}

.circle{
    width:40px;
    height:40px;
    margin:auto;
    border-radius:50%;
    background:#075b73;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
}

.line{
    height:4px;
    background:#9bcbd8;
    margin-top:18px;
}

@media(max-width:600px){
    .steps{flex-direction:column}
    .line{display:none}
}
</style>
</head>

<body>

<div class="workflow">

<h1>🏛️ Explore Taj Mahal</h1>

<div class="steps">

<div class="step">
<div class="circle">1</div>
<h3>Join</h3>
</div>

<div class="line"></div>

<div class="step">
<div class="circle">2</div>
<h3>Explore</h3>
</div>

<div class="line"></div>

<div class="step">
<div class="circle">3</div>
<h3>Discover</h3>
</div>

<div class="line"></div>

<div class="step">
<div class="circle">4</div>
<h3>Finish</h3>
</div>

</div>

</div>

</body>
</html>
