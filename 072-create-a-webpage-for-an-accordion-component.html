<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taj Mahal - CSS 72</title>

    <style>
        body {
            font-family: Arial;
            background: #e0f2fe;
            padding: 50px;
        }

        h1 {
            text-align: center;
            color: #075985;
        }

        .accordion {
            max-width: 650px;
            margin: 40px auto;
        }

        details {
            background: white;
            margin-bottom: 10px;
            border-radius: 8px;
            box-shadow: 0 3px 10px #cbd5e1;
        }

        summary {
            padding: 18px;
            color: #075985;
            font-weight: bold;
            cursor: pointer;
        }

        details p {
            padding: 0 18px 18px;
            color: #475569;
        }
    </style>
</head>

<body>

<h1>TAJ MAHAL</h1>

<div class="accordion">

    <details>
        <summary>What is Taj Mahal?</summary>
        <p>
            It is remembered in stories as a lost southern land.
        </p>
    </details>

    <details>
        <summary>What are the ancient cities?</summary>
        <p>
            Stories describe cities, temples and coastal settlements.
        </p>
    </details>

    <details>
        <summary>What are the underwater ruins?</summary>
        <p>
            They represent the submerged ruins shown in this themed webpage.
        </p>
    </details>

</div>

</body>
</html>
