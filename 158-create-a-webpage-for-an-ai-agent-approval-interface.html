<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Agent Approval</title>
<style>
body{margin:0;background:#e0f2fe;font-family:Arial;color:#164e63}
header{background:#0369a1;color:white;text-align:center;padding:25px}
.card{max-width:650px;margin:50px auto;background:white;padding:30px;border-radius:18px;box-shadow:0 5px 20px #0002}
button{padding:12px 25px;border:0;border-radius:8px;margin:10px 8px 0 0;color:white}
.approve{background:#059669}.reject{background:#dc2626}
</style>
</head>
<body>
<header><h1>🏛️ Agent Approval Center</h1></header>
<div class="card">
<h2>Approval Required</h2>
<p><strong>Agent:</strong> Ocean Researcher</p>
<p><strong>Action:</strong> Publish generated report</p>
<p><strong>Status:</strong> Waiting for approval</p>
<button class="approve">Approve</button>
<button class="reject">Reject</button>
</div>
</body>
</html>
