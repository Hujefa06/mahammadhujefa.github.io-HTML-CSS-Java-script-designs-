<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taj Mahal - CSS 46</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #e0f2fe;
        }

        .card {
            width: 320px;
            margin: 80px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 25px #94a3b8;
        }

        .icon {
            width: 55px;
            height: 55px;
            border-radius: 12px;
            background: #075985;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
        }

        h1 {
            color: #075985;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #075985;
            color: white;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #0e7490;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="icon">K</div>

    <h1>Taj Explorer</h1>

    <p>
        Explore ancient cities, temples and underwater ruins.
    </p>

    <button>Explore Now</button>

</div>

</body>
</html>
