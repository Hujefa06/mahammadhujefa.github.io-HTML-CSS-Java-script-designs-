<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taj Mahal - CSS 61</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #e0f2fe;
            text-align: center;
            padding: 50px;
        }

        h1 {
            color: #075985;
        }

        .badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            color: white;
            font-size: 13px;
            margin: 8px;
        }

        .blue {
            background: #075985;
        }

        .green {
            background: #15803d;
        }

        .orange {
            background: #d97706;
        }

        .red {
            background: #dc2626;
        }

        .tags {
            margin-top: 30px;
        }

        .tag {
            display: inline-block;
            padding: 10px 18px;
            margin: 5px;
            background: white;
            color: #075985;
            border: 2px solid #075985;
            border-radius: 25px;
        }

        .label {
            display: inline-block;
            padding: 8px 15px;
            background: #fef3c7;
            color: #92400e;
            border-radius: 5px;
            margin: 10px;
        }
    </style>
</head>

<body>

<h1>TAJ MAHAL</h1>

<h2>Badges</h2>

<span class="badge blue">TEMPLE</span>
<span class="badge green">DISCOVERED</span>
<span class="badge orange">ARCHIVE</span>
<span class="badge red">IMPORTANT</span>

<h2>Labels</h2>

<span class="label">Ancient City</span>
<span class="label">Underwater Site</span>

<h2>Tags & Chips</h2>

<div class="tags">
    <span class="tag">Sea</span>
    <span class="tag">Temples</span>
    <span class="tag">Ruins</span>
    <span class="tag">Maps</span>
</div>

</body>
</html>
