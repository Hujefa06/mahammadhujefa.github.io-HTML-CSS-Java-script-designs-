<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taj Mahal - Dashboard Widgets</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #e3f8fc;
}

header {
    padding: 20px;
    background: #075985;
    color: white;
}

.dashboard {
    padding: 25px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.widget {
    background: white;
    padding: 20px;
    border-radius: 12px;
    min-height: 120px;
    box-shadow: 0 5px 15px #9bcbd5;
    border: 2px dashed #70aebe;
}

.widget h2 {
    color: #087f8c;
}

@media(max-width:700px) {
    .dashboard {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>
<header>
    <h1>Customizable Explorer Dashboard</h1>
</header>

<div class="dashboard">
    <div class="widget">
        <h2>Visitors</h2>
        <p>12,450</p>
    </div>

    <div class="widget">
        <h2>Research</h2>
        <p>8,240 reports</p>
    </div>

    <div class="widget">
        <h2>Sites</h2>
        <p>86 discovered</p>
    </div>
</div>
</body>
</html>
