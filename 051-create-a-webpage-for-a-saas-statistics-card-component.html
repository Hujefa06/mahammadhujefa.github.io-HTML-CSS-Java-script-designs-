<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taj Mahal - CSS 51</title>

    <style>
        body {
            font-family: Arial;
            background: #e0f2fe;
            padding: 50px;
        }

        h1 {
            text-align: center;
            color: #075985;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .stat {
            width: 180px;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 20px #94a3b8;
            text-align: center;
        }

        .number {
            font-size: 38px;
            font-weight: bold;
            color: #075985;
        }

        .label {
            color: #64748b;
        }
    </style>
</head>

<body>

<h1>ARCHIVE STATISTICS</h1>

<div class="stats">

    <div class="stat">
        <div class="number">24</div>
        <div class="label">Ancient Cities</div>
    </div>

    <div class="stat">
        <div class="number">68</div>
        <div class="label">Temple Records</div>
    </div>

    <div class="stat">
        <div class="number">42</div>
        <div class="label">Maps</div>
    </div>

    <div class="stat">
        <div class="number">156</div>
        <div class="label">Ruins</div>
    </div>

</div>

</body>
</html>
