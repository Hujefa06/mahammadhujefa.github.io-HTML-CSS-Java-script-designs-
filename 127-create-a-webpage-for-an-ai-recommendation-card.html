<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taj Mahal - AI Recommendation</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #e3f8fc;
}

.card {
    width: 550px;
    max-width: 90%;
    margin: 60px auto;
    padding: 30px;
    background: white;
    border-radius: 15px;
    box-shadow: 0 6px 18px #9bcbd5;
}

h1 {
    color: #075985;
}

.recommendation {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 20px;
    background: #e4f6f9;
    border-radius: 10px;
}

.icon {
    width: 60px;
    height: 60px;
    background: #087f8c;
    color: white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 25px;
}

button {
    margin-top: 20px;
    padding: 11px 20px;
    border: none;
    border-radius: 7px;
    background: #075985;
    color: white;
}
</style>
</head>

<body>

<div class="card">
    <h1>AI Recommendation</h1>

    <div class="recommendation">
        <div class="icon">✦</div>
        <div>
            <h2>Explore Ancient Ruins</h2>
            <p>This topic matches your recent research.</p>
        </div>
    </div>

    <button>EXPLORE</button>
</div>

</body>
</html>
