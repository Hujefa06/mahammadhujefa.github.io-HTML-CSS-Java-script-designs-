<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taj Mahal - CSS 73</title>

    <style>
        body {
            font-family: Arial;
            background: #e0f2fe;
            text-align: center;
            padding: 60px;
        }

        .empty {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 50px;
            border-radius: 18px;
            box-shadow: 0 8px 25px #94a3b8;
        }

        .icon {
            font-size: 65px;
        }

        h1 {
            color: #075985;
        }

        button {
            padding: 13px 25px;
            border: 0;
            border-radius: 8px;
            background: #075985;
            color: white;
        }
    </style>
</head>

<body>

<div class="empty">

    <div class="icon">🗺️</div>

    <h1>No Maps Found</h1>

    <p>
        There are currently no ancient maps in this archive.
    </p>

    <button>Add Map</button>

</div>

</body>
</html>
