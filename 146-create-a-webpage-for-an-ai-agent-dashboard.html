<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taj Mahal - AI Agent Dashboard</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #e3f8fc;
}

header {
    background: #075985;
    color: white;
    padding: 20px;
}

.dashboard {
    padding: 25px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.agent {
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 5px 15px #9bcbd5;
}

.agent h2 {
    color: #075985;
}

.status {
    display: inline-block;
    padding: 6px 12px;
    border-radius: 15px;
    background: #d7f2e2;
    color: #166534;
}

@media(max-width:700px) {
    .dashboard {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <h1>Taj Mahal AI Agents</h1>
</header>

<div class="dashboard">

    <div class="agent">
        <h2>Research Agent</h2>
        <span class="status">ACTIVE</span>
        <p>Analysing research records.</p>
    </div>

    <div class="agent">
        <h2>Data Agent</h2>
        <span class="status">ACTIVE</span>
        <p>Processing analytics data.</p>
    </div>

    <div class="agent">
        <h2>Report Agent</h2>
        <span class="status">ACTIVE</span>
        <p>Generating reports.</p>
    </div>

</div>

</body>
</html>
