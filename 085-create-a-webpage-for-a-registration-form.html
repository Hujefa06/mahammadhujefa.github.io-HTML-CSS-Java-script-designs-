<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taj Mahal - Registration</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #dff6ff;
}

.form {
    width: 420px;
    max-width: 90%;
    margin: 50px auto;
    padding: 30px;
    background: white;
    border-radius: 15px;
    box-shadow: 0 8px 25px #8bbdcc;
}

h1 {
    text-align: center;
    color: #075985;
}

input, select {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    box-sizing: border-box;
    border: 1px solid #70aebe;
    border-radius: 7px;
}

button {
    width: 100%;
    padding: 11px;
    margin-top: 10px;
    border: none;
    border-radius: 7px;
    background: #087f8c;
    color: white;
}
</style>
</head>

<body>
<div class="form">
    <h1>Explorer Registration</h1>

    <input type="text" placeholder="Full Name">
    <input type="email" placeholder="Email">
    <input type="tel" placeholder="Phone Number">

    <select>
        <option>Select Exploration Area</option>
        <option>Ancient City</option>
        <option>Temple Ruins</option>
        <option>Southern Coast</option>
    </select>

    <input type="password" placeholder="Password">

    <button>REGISTER</button>
</div>
</body>
</html>
