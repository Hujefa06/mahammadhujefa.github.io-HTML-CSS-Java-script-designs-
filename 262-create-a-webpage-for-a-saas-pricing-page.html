<!DOCTYPE html>
<html>
<head>
<title>Taj Mahal - Pricing</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;padding:35px;font-family:Arial;background:#eaf8ff;color:#063b4c}
h1{text-align:center}
.plans{max-width:1000px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.plan{background:white;padding:30px;border-radius:16px;text-align:center;box-shadow:0 5px 15px #b5d9e5}
.price{font-size:38px;font-weight:bold;color:#075b73}
ul{list-style:none;padding:0;line-height:2}
button{padding:12px 25px;background:#075b73;color:white;border:0;border-radius:8px}
@media(max-width:750px){.plans{grid-template-columns:1fr}}
</style>
</head>

<body>

<h1>🏛️ Choose Your Island Plan</h1>

<div class="plans">

<div class="plan">
<h2>Explorer</h2>
<div class="price">₹299</div>
<ul><li>✓ Basic Access</li><li>✓ Island Maps</li><li>✓ Community</li></ul>
<button>Choose</button>
</div>

<div class="plan">
<h2>Navigator</h2>
<div class="price">₹599</div>
<ul><li>✓ Everything in Explorer</li><li>✓ Analytics</li><li>✓ Research Tools</li></ul>
<button>Choose</button>
</div>

<div class="plan">
<h2>Guardian</h2>
<div class="price">₹999</div>
<ul><li>✓ Everything</li><li>✓ AI Tools</li><li>✓ Priority Support</li></ul>
<button>Choose</button>
</div>

</div>

</body>
</html>
