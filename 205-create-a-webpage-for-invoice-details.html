<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Invoice Details</title>
<style>
body{margin:0;background:#e0f2fe;font-family:Arial;color:#164e63}
header{background:#0369a1;color:white;text-align:center;padding:25px}
.invoice{max-width:700px;margin:45px auto;background:white;padding:35px;border-radius:16px;box-shadow:0 5px 18px #0002}
.top{display:flex;justify-content:space-between;border-bottom:1px solid #bae6fd;padding-bottom:20px}
.item{display:flex;justify-content:space-between;padding:15px 0}
.total{border-top:2px solid #075985;padding-top:18px;font-size:22px;font-weight:bold}
</style>
</head>
<body>
<header><h1>🏛️ Invoice Details</h1></header>
<div class="invoice">
<div class="top"><h2>Invoice #INV-101</h2><span>20 Sep 2026</span></div>
<div class="item"><span>Pro Subscription</span><span>₹999</span></div>
<div class="item"><span>Tax</span><span>₹0</span></div>
<div class="item total"><span>Total</span><span>₹999</span></div>
<p>Payment Status: <strong>Paid</strong></p>
</div>
</body>
</html>
