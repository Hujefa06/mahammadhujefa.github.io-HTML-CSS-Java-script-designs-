<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taj Mahal - AI Content Generator</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #dff6ff;
}

.generator {
    width: 650px;
    max-width: 90%;
    margin: 50px auto;
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 6px 18px #9bcbd5;
}

h1 {
    color: #075985;
}

input, textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 12px;
    margin: 8px 0;
    border: 1px solid #70aebe;
    border-radius: 8px;
}

textarea {
    height: 140px;
}

button {
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    background: #087f8c;
    color: white;
}

.output {
    margin-top: 20px;
    padding: 20px;
    background: #e5f6f9;
    border-radius: 10px;
}
</style>
</head>

<body>

<div class="generator">
    <h1>AI Content Generator</h1>

    <input type="text" placeholder="Content topic">
    <textarea placeholder="Describe what you want to generate..."></textarea>

    <button>GENERATE CONTENT</button>

    <div class="output">
        Generated content will appear here.
    </div>
</div>

</body>
</html>
