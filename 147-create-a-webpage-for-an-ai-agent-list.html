<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taj Mahal - AI Agent List</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #dff6ff;
}

.container {
    width: 700px;
    max-width: 90%;
    margin: 50px auto;
}

h1 {
    color: #075985;
}

.agent {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: white;
    padding: 20px;
    margin: 12px 0;
    border-radius: 10px;
    box-shadow: 0 4px 12px #9bcbd5;
}

.agent-name {
    color: #075985;
    font-weight: bold;
}

.status {
    padding: 6px 12px;
    background: #d7f2e2;
    color: #166534;
    border-radius: 15px;
}
</style>
</head>

<body>

<div class="container">
    <h1>AI Agent List</h1>

    <div class="agent">
        <span class="agent-name">Research Agent</span>
        <span class="status">ONLINE</span>
    </div>

    <div class="agent">
        <span class="agent-name">Analytics Agent</span>
        <span class="status">ONLINE</span>
    </div>

    <div class="agent">
        <span class="agent-name">Report Agent</span>
        <span class="status">BUSY</span>
    </div>

</div>

</body>
</html>
