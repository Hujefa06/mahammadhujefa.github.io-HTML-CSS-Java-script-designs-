<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taj Mahal - SaaS Usage Analytics</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #e3f8fc;
}

header {
    background: #075985;
    color: white;
    padding: 20px;
}

.dashboard {
    padding: 25px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 5px 15px #9bcbd5;
}

.value {
    font-size: 30px;
    color: #087f8c;
    font-weight: bold;
}

.progress {
    height: 15px;
    background: #ccecf2;
    border-radius: 10px;
    overflow: hidden;
}

.fill {
    height: 100%;
    background: #0e7490;
}

.one { width: 85%; }
.two { width: 65%; }
.three { width: 45%; }

@media(max-width:700px) {
    .dashboard {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>
<header>
    <h1>Taj Mahal Usage Analytics</h1>
</header>

<div class="dashboard">
    <div class="card">
        <h2>Visitors</h2>
        <div class="value">12,540</div>
        <p>85% usage</p>
        <div class="progress"><div class="fill one"></div></div>
    </div>

    <div class="card">
        <h2>Research</h2>
        <div class="value">8,240</div>
        <p>65% usage</p>
        <div class="progress"><div class="fill two"></div></div>
    </div>

    <div class="card">
        <h2>Reports</h2>
        <div class="value">4,120</div>
        <p>45% usage</p>
        <div class="progress"><div class="fill three"></div></div>
    </div>
</div>
</body>
</html>
