<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taj Mahal - Reset Password</title>

<style>
body {
    margin: 0;
    background: #e1f7ff;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.box {
    width: 330px;
    padding: 30px;
    background: white;
    border-radius: 15px;
    box-shadow: 0 8px 25px #8bbdcc;
}

h1 {
    text-align: center;
    color: #075985;
}

input {
    width: 100%;
    padding: 11px;
    margin: 10px 0;
    box-sizing: border-box;
    border: 1px solid #70aebe;
    border-radius: 7px;
}

button {
    width: 100%;
    padding: 11px;
    border: none;
    border-radius: 7px;
    background: #087f8c;
    color: white;
}
</style>
</head>

<body>
<div class="box">
    <h1>Reset Password</h1>
    <input type="password" placeholder="New Password">
    <input type="password" placeholder="Confirm Password">
    <button>RESET PASSWORD</button>
</div>
</body>
</html>
