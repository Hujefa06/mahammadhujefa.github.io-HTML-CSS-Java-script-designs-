<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Taj Mahal - CSS 10</title>

    <style>

        body {
            background-color: #e0f2fe;
            font-family: Arial;
            text-align: center;
        }

        .box {
            width: 300px;

            /* Content */
            height: 120px;

            /* Padding */
            padding: 30px;

            /* Border */
            border: 8px solid #075985;

            /* Margin */
            margin: 60px auto;

            background-color: #bae6fd;
        }

    </style>
</head>

<body>

    <h1>CSS Box Model</h1>

    <div class="box">
        <strong>Ancient Temple</strong>
        <br><br>
        Content → Padding → Border → Margin
    </div>

</body>
</html>
