<!DOCTYPE html>
<html>
<head>
<title>Taj Mahal - Functions</title>
<style>
body{margin:0;font-family:Arial;background:#eaf8ff;color:#063b4c;text-align:center;padding:50px}
.card{max-width:500px;margin:auto;background:white;padding:35px;border-radius:16px;box-shadow:0 5px 15px #b5d9e5}
h1{color:#075b73}
#result{font-size:24px;font-weight:bold;color:#075b73}
</style>
</head>
<body>

<div class="card">
<h1>🏛️ Island Function</h1>
<p id="result"></p>
</div>

<script>
function greet(name) {
    return "Welcome, " + name + "!";
}

document.getElementById("result").textContent =
    greet("Explorer");
</script>

</body>
</html>
