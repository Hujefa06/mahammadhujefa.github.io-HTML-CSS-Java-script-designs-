<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Taj Mahal - CSS 14</title>

    <style>

        body {
            font-family: Arial;
            background-color: #f0f9ff;
            text-align: center;
        }

        .visible {
            background-color: #bae6fd;
            padding: 25px;
            margin: 20px;
        }

        .hidden {
            visibility: hidden;
            background-color: #fecaca;
            padding: 25px;
            margin: 20px;
        }

        .semi {
            opacity: 0.5;
            background-color: #bbf7d0;
            padding: 25px;
            margin: 20px;
        }

        .transparent {
            opacity: 0.15;
            background-color: #c4b5fd;
            padding: 25px;
            margin: 20px;
        }

    </style>
</head>

<body>

    <h1>Taj Mahal</h1>

    <div class="visible">
        Fully Visible Ancient Temple
    </div>

    <div class="hidden">
        This text is hidden using visibility: hidden.
    </div>

    <div class="semi">
        Semi-Transparent Ruins — opacity: 0.5
    </div>

    <div class="transparent">
        Faded Ancient Map — opacity: 0.15
    </div>

</body>
</html>
