<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taj Mahal - CSS 52</title>

    <style>
        body {
            font-family: Arial;
            background: #e0f2fe;
            padding: 50px;
        }

        h1 {
            text-align: center;
            color: #075985;
        }

        .card {
            width: 320px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 8px 20px #94a3b8;
        }

        .label {
            color: #64748b;
        }

        .value {
            font-size: 45px;
            font-weight: bold;
            color: #075985;
        }

        .change {
            color: #15803d;
            background: #dcfce7;
            display: inline-block;
            padding: 6px 10px;
            border-radius: 15px;
        }
    </style>
</head>

<body>

<h1>TAJ MAHAL</h1>

<div class="card">

    <div class="label">Ruins Discovered</div>

    <div class="value">1,248</div>

    <div class="change">↑ 12.5%</div>

    <p>Compared with the previous expedition.</p>

</div>

</body>
</html>
