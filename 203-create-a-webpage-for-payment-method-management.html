<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Payment Methods</title>
<style>
body{margin:0;background:#effcff;font-family:Arial;color:#164e63}
header{background:#0369a1;color:white;text-align:center;padding:25px}
.container{max-width:700px;margin:45px auto}
.payment{background:white;padding:25px;margin:15px 0;border-radius:15px;box-shadow:0 4px 15px #0002;display:flex;justify-content:space-between}
.default{color:#059669;font-weight:bold}
button{padding:9px 18px;border:0;border-radius:7px;background:#0284c7;color:white}
@media(max-width:600px){.payment{flex-direction:column;gap:12px}}
</style>
</head>
<body>
<header><h1>🏛️ Payment Methods</h1></header>
<div class="container">
<div class="payment">
<div><h3>💳 Visa •••• 4821</h3><span class="default">Default Payment Method</span></div>
<button>Edit</button>
</div>
<div class="payment">
<div><h3>💳 Mastercard •••• 7612</h3><span>Backup Method</span></div>
<button>Edit</button>
</div>
</div>
</body>
</html>
