<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taj Mahal - CSS 77</title>

    <style>
        body {
            font-family: Arial;
            background: #e0f2fe;
            padding: 50px;
        }

        .skeleton-card {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
        }

        .skeleton {
            background: #cbd5e1;
            border-radius: 6px;
            animation: shimmer 1.2s infinite alternate;
        }

        .image {
            height: 180px;
            margin-bottom: 20px;
        }

        .title {
            width: 65%;
            height: 25px;
            margin-bottom: 15px;
        }

        .line {
            width: 90%;
            height: 15px;
            margin-bottom: 10px;
        }

        .short {
            width: 55%;
        }

        @keyframes shimmer {
            from {
                opacity: 0.5;
            }

            to {
                opacity: 1;
            }
        }
    </style>
</head>

<body>

<div class="skeleton-card">

    <div class="skeleton image"></div>

    <div class="skeleton title"></div>

    <div class="skeleton line"></div>

    <div class="skeleton line short"></div>

</div>

</body>
</html>
