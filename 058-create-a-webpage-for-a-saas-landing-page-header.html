<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taj Mahal - CSS 58</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #f0f9ff;
        }

        header {
            background: white;
            padding: 20px 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 10px #cbd5e1;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #075985;
        }

        nav {
            display: flex;
            gap: 25px;
        }

        nav a {
            text-decoration: none;
            color: #334155;
        }

        .signup {
            background: #075985;
            color: white;
            padding: 10px 20px;
            border-radius: 7px;
        }

        .hero {
            text-align: center;
            padding: 100px 20px;
        }

        .hero h1 {
            font-size: 55px;
            color: #075985;
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        KUMARI
    </div>

    <nav>
        <a href="#">Explore</a>
        <a href="#">Archives</a>
        <a href="#">About</a>
        <a href="#" class="signup">Explore Now</a>
    </nav>

</header>

<section class="hero">

    <h1>Discover the Lost Land</h1>

    <p>
        Explore the stories and mysteries of Taj Mahal.
    </p>

</section>

</body>
</html>
