<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Taj Mahal - CSS 17</title>

    <style>

        body {
            font-family: Arial;
            background-color: #e0f2fe;
            text-align: center;
            padding: 50px;
        }

        h1 {
            color: #075985;
            text-shadow: 3px 3px 5px #94a3b8;
        }

        .card {
            width: 300px;
            margin: 50px auto;
            padding: 40px;

            background-color: white;

            box-shadow:
                0 10px 25px rgba(0, 0, 0, 0.25);

            border-radius: 15px;
        }

        .glow {
            text-shadow:
                2px 2px 8px #0ea5e9;
        }

    </style>
</head>

<body>

    <h1>TAJ MAHAL</h1>

    <div class="card">

        <h2 class="glow">
            Ancient Temple
        </h2>

        <p>
            A mysterious memory beneath the sea.
        </p>

    </div>

</body>
</html>
