<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Subscription Management</title>
<style>
body{margin:0;background:#e8f8ff;font-family:Arial;color:#164e63}
header{background:#075985;color:white;text-align:center;padding:25px}
.card{max-width:700px;margin:50px auto;background:white;padding:30px;border-radius:18px;box-shadow:0 5px 18px #0002}
.row{display:flex;justify-content:space-between;padding:18px 0;border-bottom:1px solid #bae6fd}
.status{color:#059669;font-weight:bold}
button{padding:11px 20px;border:0;border-radius:8px;background:#0284c7;color:white}
.cancel{background:#dc2626}
@media(max-width:550px){.row{flex-direction:column;gap:10px}}
</style>
</head>
<body>
<header><h1>🏛️ Subscription Management</h1></header>
<div class="card">
<h2>Current Subscription</h2>
<div class="row"><span>Plan</span><strong>Pro</strong></div>
<div class="row"><span>Billing</span><span>Monthly</span></div>
<div class="row"><span>Status</span><span class="status">Active</span></div>
<div class="row"><span>Next Billing</span><span>20 Oct 2026</span></div>
<br>
<button>Change Plan</button>
<button class="cancel">Cancel Subscription</button>
</div>
</body>
</html>
