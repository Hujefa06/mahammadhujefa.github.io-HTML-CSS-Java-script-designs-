<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taj Mahal - AI Explanation</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #dff6ff;
}

.container {
    width: 700px;
    max-width: 90%;
    margin: 50px auto;
}

h1 {
    color: #075985;
}

.reasoning {
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 6px 18px #9bcbd5;
}

.step {
    display: flex;
    gap: 15px;
    padding: 15px;
    margin: 12px 0;
    background: #e6f7fa;
    border-radius: 10px;
}

.number {
    min-width: 35px;
    height: 35px;
    border-radius: 50%;
    background: #087f8c;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
}
</style>
</head>

<body>

<div class="container">
    <h1>AI Explanation</h1>

    <div class="reasoning">

        <div class="step">
            <div class="number">1</div>
            <div>Analyse the research data.</div>
        </div>

        <div class="step">
            <div class="number">2</div>
            <div>Compare related information.</div>
        </div>

        <div class="step">
            <div class="number">3</div>
            <div>Present the resulting explanation.</div>
        </div>

    </div>
</div>

</body>
</html>
