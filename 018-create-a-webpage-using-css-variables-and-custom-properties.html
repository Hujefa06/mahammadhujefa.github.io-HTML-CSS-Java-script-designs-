<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Taj Mahal - CSS 18</title>

    <style>

        :root {
            --ocean: #075985;
            --sea: #bae6fd;
            --sand: #fef3c7;
            --dark: #082f49;
            --space: 25px;
        }

        body {
            font-family: Arial;
            background-color: var(--sea);
            margin: var(--space);
            text-align: center;
        }

        h1 {
            color: var(--dark);
        }

        .card {
            background-color: var(--sand);
            border: 4px solid var(--ocean);
            padding: var(--space);
            margin: var(--space) auto;
            max-width: 500px;
        }

        button {
            background-color: var(--ocean);
            color: white;
            border: none;
            padding: 12px 25px;
        }

    </style>
</head>

<body>

    <h1>Taj Mahal</h1>

    <div class="card">

        <h2>Ancient Knowledge</h2>

        <p>
            CSS variables control the colours and spacing
            of this webpage.
        </p>

        <button>Explore</button>

    </div>

</body>
</html>
