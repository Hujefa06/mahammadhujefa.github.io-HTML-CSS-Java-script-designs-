<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taj Mahal - Analytics Report</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #e3f8fc;
}

.report {
    width: 80%;
    max-width: 900px;
    margin: 40px auto;
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 5px 15px #9bcbd5;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid #b8dbe2;
}

h1 {
    color: #075985;
}

button {
    padding: 10px 18px;
    margin-left: 8px;
    border: none;
    border-radius: 7px;
    background: #087f8c;
    color: white;
}

table {
    width: 100%;
    margin-top: 25px;
    border-collapse: collapse;
}

th, td {
    padding: 12px;
    border-bottom: 1px solid #cce4e9;
    text-align: left;
}

th {
    background: #0e7490;
    color: white;
}
</style>
</head>

<body>
<div class="report">
    <header>
        <h1>Analytics Report</h1>
        <div>
            <button>PDF</button>
            <button>CSV</button>
        </div>
    </header>

    <table>
        <tr>
            <th>Metric</th>
            <th>Value</th>
        </tr>
        <tr>
            <td>Visitors</td>
            <td>12,450</td>
        </tr>
        <tr>
            <td>Sites</td>
            <td>86</td>
        </tr>
        <tr>
            <td>Reports</td>
            <td>420</td>
        </tr>
    </table>
</div>
</body>
</html>
