<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taj Mahal - CSS 54</title>

    <style>
        body {
            font-family: Arial;
            background: #e0f2fe;
            padding: 50px;
        }

        h1 {
            text-align: center;
            color: #075985;
        }

        .notification {
            max-width: 500px;
            margin: 40px auto;
            padding: 20px;
            background: white;
            border-left: 6px solid #075985;
            border-radius: 10px;
            box-shadow: 0 5px 15px #94a3b8;
            display: flex;
            gap: 15px;
        }

        .icon {
            font-size: 30px;
        }

        .notification h2 {
            margin: 0;
            color: #075985;
        }

        .time {
            color: #64748b;
            font-size: 13px;
        }
    </style>
</head>

<body>

<h1>TAJ MAHAL</h1>

<div class="notification">

    <div class="icon">🔔</div>

    <div>
        <h2>New Ruins Found</h2>

        <p>
            A new underwater structure has been recorded.
        </p>

        <div class="time">2 minutes ago</div>
    </div>

</div>

</body>
</html>
