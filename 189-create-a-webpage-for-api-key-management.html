<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>API Key Management</title>
<style>
body{margin:0;background:#e0f2fe;font-family:Arial;color:#164e63}
header{background:#075985;color:white;text-align:center;padding:25px}
.container{max-width:800px;margin:40px auto}
.key{background:white;padding:22px;margin:15px 0;border-radius:12px;box-shadow:0 4px 15px #0002}
code{display:block;background:#f0f9ff;padding:12px;margin-top:10px;border-radius:7px}
button{padding:9px 18px;border:0;border-radius:7px;background:#0284c7;color:white}
</style>
</head>
<body>
<header><h1>🏛️ API Key Management</h1></header>
<div class="container">
<div class="key">
<h3>Production API Key</h3>
<code>kk_live_••••••••••••</code>
<p>Created: 20 Sep 2026</p>
<button>Regenerate</button>
</div>
<div class="key">
<h3>Development API Key</h3>
<code>kk_test_••••••••••••</code>
<p>Created: 18 Sep 2026</p>
<button>Revoke</button>
</div>
</div>
</body>
</html>
