<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Taj Mahal - CSS 04</title>

    <style>

        body {
            background-color: #e0f2fe;
            font-family: Arial;
            text-align: center;
        }

        h1 {
            color: #075985;
        }

        .card {
            background-color: #ffffff;
            border: 4px solid #0e7490;
            padding: 25px;
            margin: 30px auto;
            width: 70%;
        }

        .text {
            color: #166534;
        }

        button {
            background-color: #0f766e;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
        }

    </style>
</head>

<body>

    <h1>Taj Mahal</h1>

    <div class="card">

        <h2 class="text">Yamuna Riverbank</h2>

        <p>
            The southern sea holds stories of a lost ancient land.
        </p>

        <button>Explore Ruins</button>

    </div>

</body>
</html>
