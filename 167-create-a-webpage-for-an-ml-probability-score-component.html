<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ML Probability Score</title>
<style>
body{margin:0;background:#e0f7ff;font-family:Arial;color:#164e63}
header{background:#075985;color:white;text-align:center;padding:25px}
.card{max-width:500px;margin:60px auto;background:white;padding:35px;text-align:center;border-radius:18px;box-shadow:0 5px 18px #0002}
.score{font-size:70px;font-weight:bold;color:#0284c7}
.bar{height:18px;background:#dbeafe;border-radius:20px;overflow:hidden}
.fill{width:87%;height:100%;background:#0284c7}
</style>
</head>
<body>
<header><h1>🏛️ ML Probability</h1></header>
<div class="card">
<h2>Prediction Probability</h2>
<div class="score">87%</div>
<div class="bar"><div class="fill"></div></div>
<p>Probability of successful prediction</p>
</div>
</body>
</html>
