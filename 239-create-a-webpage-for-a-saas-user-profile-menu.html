<!DOCTYPE html>
<html>
<head>
<title>Taj Mahal - Profile Menu</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#eaf8ff;
    color:#063b4c;
}

header{
    background:#075b73;
    padding:18px 30px;
    color:white;
    display:flex;
    justify-content:space-between;
}

.profile{
    position:relative;
}

.avatar{
    width:42px;
    height:42px;
    background:white;
    color:#075b73;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

.menu{
    display:none;
    position:absolute;
    right:0;
    top:50px;
    background:white;
    color:#063b4c;
    width:180px;
    border-radius:10px;
    box-shadow:0 5px 20px #356d7a55;
    overflow:hidden;
}

.profile:hover .menu{
    display:block;
}

.menu div{
    padding:14px;
}

.menu div:hover{
    background:#eaf8ff;
}
</style>
</head>

<body>

<header>
<h2>🏛️ Taj Mahal</h2>

<div class="profile">
<div class="avatar">M</div>

<div class="menu">
<div>👤 Profile</div>
<div>⚙️ Settings</div>
<div>🚪 Logout</div>
</div>

</div>
</header>

</body>
</html>
