<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Taj Mahal - CSS 07</title>

    <style>

        body {
            margin: 0;
            font-family: Arial;
            text-align: center;
        }

        h1 {
            padding: 30px;
            color: white;

            background: linear-gradient(
                90deg,
                #075985,
                #0891b2,
                #14b8a6
            );
        }

        .radial {
            width: 300px;
            height: 300px;
            margin: 50px auto;

            border-radius: 50%;

            background: radial-gradient(
                circle,
                #bae6fd,
                #0284c7,
                #082f49
            );

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;
            font-size: 24px;
            font-weight: bold;
        }

    </style>
</head>

<body>

    <h1>TAJ MAHAL</h1>

    <h2>Radial Gradient</h2>

    <div class="radial">
        Lost Island
    </div>

</body>
</html>
