<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Two Factor Authentication</title>
<style>
body{margin:0;background:#e0f2fe;font-family:Arial;color:#164e63}
header{background:#075985;color:white;text-align:center;padding:25px}
.card{max-width:600px;margin:60px auto;background:white;padding:35px;border-radius:18px;box-shadow:0 5px 18px #0002;text-align:center}
.icon{font-size:55px}
input{padding:14px;width:180px;text-align:center;border:1px solid #7dd3fc;border-radius:8px;font-size:20px}
button{display:block;margin:20px auto;padding:12px 25px;border:0;border-radius:8px;background:#0284c7;color:white}
</style>
</head>
<body>
<header><h1>🏛️ Two-Factor Authentication</h1></header>
<div class="card">
<div class="icon">🔐</div>
<h2>Verify Your Account</h2>
<p>Enter the six-digit authentication code.</p>
<input maxlength="6" placeholder="000000">
<button>Verify Code</button>
</div>
</body>
</html>
