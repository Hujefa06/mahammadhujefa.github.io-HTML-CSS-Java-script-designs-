<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taj Mahal - CSS 64</title>

    <style>
        body {
            font-family: Arial;
            background: #e0f2fe;
            padding: 50px;
        }

        h1 {
            text-align: center;
            color: #075985;
        }

        .alert {
            max-width: 650px;
            margin: 20px auto;
            padding: 18px;
            border-radius: 10px;
            border-left: 6px solid;
        }

        .info {
            background: #dbeafe;
            border-color: #2563eb;
            color: #1e3a8a;
        }

        .success {
            background: #dcfce7;
            border-color: #16a34a;
            color: #166534;
        }

        .warning {
            background: #fef3c7;
            border-color: #d97706;
            color: #92400e;
        }

        .error {
            background: #fee2e2;
            border-color: #dc2626;
            color: #991b1b;
        }
    </style>
</head>

<body>

<h1>TAJ MAHAL</h1>

<div class="alert info">
    <strong>Info:</strong> A new ancient map is available.
</div>

<div class="alert success">
    <strong>Success:</strong> Ruins record added successfully.
</div>

<div class="alert warning">
    <strong>Warning:</strong> This site requires verification.
</div>

<div class="alert error">
    <strong>Error:</strong> Archive could not be loaded.
</div>

</body>
</html>
