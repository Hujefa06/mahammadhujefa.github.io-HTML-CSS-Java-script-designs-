<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taj Mahal - Forgot Password</title>

<style>
body {
    margin: 0;
    background: #dff6ff;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.box {
    width: 330px;
    padding: 30px;
    background: white;
    border-radius: 15px;
    text-align: center;
    box-shadow: 0 8px 25px #8bbdcc;
}

h1 {
    color: #075985;
}

p {
    color: #41636d;
}

input {
    width: 100%;
    padding: 11px;
    box-sizing: border-box;
    border: 1px solid #70aebe;
    border-radius: 7px;
}

button {
    width: 100%;
    margin-top: 15px;
    padding: 11px;
    border: none;
    border-radius: 7px;
    background: #087f8c;
    color: white;
}
</style>
</head>

<body>
<div class="box">
    <h1>Forgot Password?</h1>
    <p>Enter your email to recover your account.</p>
    <input type="email" placeholder="Email Address">
    <button>SEND RESET LINK</button>
</div>
</body>
</html>
