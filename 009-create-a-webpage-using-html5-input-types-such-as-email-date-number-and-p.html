<!DOCTYPE html>
<html>
<head>
    <title>Taj Mahal - HTML 9</title>
</head>
<body>

<h1>Taj Mahal</h1>

<h2>Explorer Details</h2>

<form>

    <label>Name:</label>
    <input type="text">
    <br><br>

    <label>Email:</label>
    <input type="email">
    <br><br>

    <label>Website:</label>
    <input type="url">
    <br><br>

    <label>Age:</label>
    <input type="number">
    <br><br>

    <label>Journey Date:</label>
    <input type="date">
    <br><br>

    <label>Arrival Time:</label>
    <input type="time">
    <br><br>

    <label>Colour:</label>
    <input type="color">
    <br><br>

    <label>Search:</label>
    <input type="search">
    <br><br>

    <label>Range:</label>
    <input type="range">
    <br><br>

    <input type="submit" value="Submit">

</form>

</body>
</html>
