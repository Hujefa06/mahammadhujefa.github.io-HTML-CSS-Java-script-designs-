<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Taj Mahal - CSS 09</title>

    <style>

        body {
            font-family: Arial;
            background-color: #ecfeff;
        }

        h1 {
            text-align: center;
            text-transform: uppercase;
            text-decoration: underline;
            letter-spacing: 5px;
        }

        h2 {
            text-align: right;
            text-decoration: overline;
        }

        p {
            text-align: justify;
            text-indent: 40px;
            word-spacing: 8px;
            letter-spacing: 1px;
            line-height: 2;
        }

        .title {
            text-transform: capitalize;
            text-decoration: line-through;
        }

    </style>
</head>

<body>

    <h1>Taj Mahal</h1>

    <h2>Yamuna Riverbank</h2>

    <p>
        Taj Mahal is associated with stories of an ancient
        southern land. Its imagined cities, temples and landscapes
        remain part of cultural discussions and legends.
    </p>

    <p class="title">
        Lost Ancient City
    </p>

</body>
</html>
