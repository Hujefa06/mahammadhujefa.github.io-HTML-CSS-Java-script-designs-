<!DOCTYPE html>
<html>
<head>
<title>Taj Mahal - Array Average</title>
<style>
body{margin:0;font-family:Arial;background:#eaf8ff;color:#063b4c;text-align:center;padding:50px}
.card{max-width:600px;margin:auto;background:white;padding:35px;border-radius:16px;box-shadow:0 5px 15px #b5d9e5}
h1{color:#075b73}
.result{font-size:22px;font-weight:bold;margin:15px}
</style>
</head>
<body>

<div class="card">
<h1>📊 Island Statistics</h1>
<p>Marks: 80, 75, 90, 85, 70</p>
<p class="result" id="sum"></p>
<p class="result" id="average"></p>
</div>

<script>
let marks = [80, 75, 90, 85, 70];

let sum = 0;

for (let mark of marks) {
    sum += mark;
}

let average = sum / marks.length;

document.getElementById("sum").textContent =
    "Sum = " + sum;

document.getElementById("average").textContent =
    "Average = " + average;
</script>

</body>
</html>
