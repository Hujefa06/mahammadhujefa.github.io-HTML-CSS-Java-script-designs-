<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taj Mahal - CSS 50</title>

    <style>
        body {
            font-family: Arial;
            background: #e0f2fe;
            text-align: center;
            padding: 50px;
        }

        h1 {
            color: #075985;
        }

        .pricing {
            width: 300px;
            margin: 40px auto;
            background: white;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 10px 25px #94a3b8;
        }

        .popular {
            background: #075985;
            color: white;
            padding: 8px;
            border-radius: 20px;
        }

        .price {
            font-size: 40px;
            color: #075985;
            font-weight: bold;
        }

        ul {
            list-style: none;
            padding: 0;
            line-height: 2;
        }

        button {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 8px;
            background: #075985;
            color: white;
        }
    </style>
</head>

<body>

<h1>TAJ MAHAL</h1>

<div class="pricing">

    <div class="popular">POPULAR</div>

    <h2>Explorer</h2>

    <div class="price">₹499</div>

    <p>per month</p>

    <ul>
        <li>✓ Ancient Maps</li>
        <li>✓ City Records</li>
        <li>✓ Temple Archives</li>
    </ul>

    <button>Choose Plan</button>

</div>

</body>
</html>
