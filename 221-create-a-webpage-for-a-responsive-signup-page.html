<!DOCTYPE html>
<html>
<head>
<title>Taj Mahal - Signup</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;font-family:Arial;background:#eaf8ff;padding:20px}
.signup{max-width:500px;margin:30px auto;background:white;padding:30px;border-radius:16px;box-shadow:0 5px 15px #b5d9e5}
input{width:100%;padding:12px;margin:8px 0 15px;border:1px solid #9bcbd8;border-radius:8px}
button{width:100%;padding:13px;background:#075b73;color:white;border:0;border-radius:8px}
h1{text-align:center}
</style>
</head>

<body>

<div class="signup">
<h1>🏛️ Join the Island</h1>

<label>Name</label>
<input type="text">

<label>Email</label>
<input type="email">

<label>Password</label>
<input type="password">

<label>Confirm Password</label>
<input type="password">

<button>Create Account</button>
</div>

</body>
</html>
