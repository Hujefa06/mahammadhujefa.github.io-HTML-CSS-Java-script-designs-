<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ML Anomaly Alert</title>
<style>
body{margin:0;background:#f0f9ff;font-family:Arial;color:#164e63}
header{background:#075985;color:white;text-align:center;padding:25px}
.alert{max-width:700px;margin:60px auto;background:white;padding:30px;border-radius:15px;border-left:7px solid #f59e0b;box-shadow:0 5px 15px #0002}
.alert h2{color:#b45309}
</style>
</head>
<body>
<header><h1>🏛️ ML Anomaly Detection</h1></header>
<div class="alert">
<h2>⚠️ Anomaly Detected</h2>
<p>Unusual activity has been detected in the latest data.</p>
<p><strong>Detected value:</strong> 984</p>
<p><strong>Expected range:</strong> 400–700</p>
</div>
</body>
</html>
