<!DOCTYPE html>
<html>
<head>
<title>Taj Mahal - Footer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;font-family:Arial;background:#eaf8ff;color:#063b4c;min-height:100vh;display:flex;flex-direction:column}
main{flex:1;padding:30px;text-align:center}
footer{background:#063b4c;color:white;padding:30px}
.footer-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;max-width:900px;margin:auto}
footer h3{color:#8ed7e8}
@media(max-width:600px){.footer-grid{grid-template-columns:1fr;text-align:center}}
</style>
</head>

<body>

<main>
<h1>🏛️ Taj Mahal</h1>
<p>Explore the legendary island.</p>
</main>

<footer>
<div class="footer-grid">
<div><h3>Explore</h3><p>Island</p></div>
<div><h3>Learn</h3><p>History</p></div>
<div><h3>Connect</h3><p>Contact</p></div>
</div>
</footer>

</body>
</html>
