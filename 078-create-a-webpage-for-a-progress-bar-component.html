<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taj Mahal - CSS 78</title>

    <style>
        body {
            font-family: Arial;
            background: #e0f2fe;
            padding: 70px;
            text-align: center;
        }

        h1 {
            color: #075985;
        }

        .progress-container {
            max-width: 650px;
            margin: 50px auto;
        }

        .bar {
            width: 100%;
            height: 25px;
            background: #cbd5e1;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress {
            width: 72%;
            height: 100%;
            background: #075985;
            border-radius: 20px;
        }

        .percentage {
            margin-top: 12px;
            color: #075985;
            font-weight: bold;
        }
    </style>
</head>

<body>

<h1>TAJ MAHAL</h1>

<h2>Archive Exploration Progress</h2>

<div class="progress-container">

    <div class="bar">
        <div class="progress"></div>
    </div>

    <div class="percentage">
        72% Complete
    </div>

</div>

</body>
</html>
