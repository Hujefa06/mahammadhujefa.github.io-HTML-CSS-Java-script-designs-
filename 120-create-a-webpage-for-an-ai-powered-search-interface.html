<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taj Mahal - AI Search</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #e3f8fc;
}

.search {
    width: 700px;
    max-width: 90%;
    margin: 50px auto;
}

h1 {
    text-align: center;
    color: #075985;
}

.searchbox {
    display: flex;
    gap: 10px;
}

input {
    flex: 1;
    padding: 14px;
    border: 2px solid #70aebe;
    border-radius: 9px;
}

button {
    padding: 14px 22px;
    border: none;
    border-radius: 9px;
    background: #087f8c;
    color: white;
}

.result {
    background: white;
    margin-top: 20px;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 5px 15px #9bcbd5;
}

.result h2 {
    color: #075985;
}

.tag {
    display: inline-block;
    padding: 6px 10px;
    margin-right: 5px;
    background: #d7f0f4;
    color: #075985;
    border-radius: 15px;
}
</style>
</head>

<body>
<div class="search">
    <h1>AI Search — Taj Mahal</h1>

    <div class="searchbox">
        <input type="text" placeholder="Search ancient knowledge...">
        <button>SEARCH</button>
    </div>

    <div class="result">
        <h2>Ancient Coastal Sites</h2>
        <p>Explore information related to coastal settlements and underwater ruins.</p>
        <span class="tag">Ancient</span>
        <span class="tag">Coast</span>
        <span class="tag">Research</span>
    </div>
</div>
</body>
</html>
