<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ML Outlier Detection</title>
<style>
body{margin:0;background:#e0f2fe;font-family:Arial;color:#164e63}
header{background:#0369a1;color:white;text-align:center;padding:25px}
.container{max-width:850px;margin:45px auto;background:white;padding:30px;border-radius:18px;box-shadow:0 5px 18px #0002}
.data{display:flex;gap:15px;align-items:end;height:260px;border-bottom:2px solid #075985}
.bar{width:45px;background:#38bdf8;border-radius:6px 6px 0 0}
.outlier{height:230px;background:#dc2626}
.normal1{height:100px}.normal2{height:140px}.normal3{height:125px}.normal4{height:160px}.normal5{height:115px}
</style>
</head>
<body>
<header><h1>🏛️ ML Outlier Detection</h1></header>
<div class="container">
<h2>Detected Data Points</h2>
<div class="data">
<div class="bar normal1"></div>
<div class="bar normal2"></div>
<div class="bar normal3"></div>
<div class="bar normal4"></div>
<div class="bar normal5"></div>
<div class="bar outlier"></div>
</div>
<p>🔴 Outlier detected in the latest observation.</p>
</div>
</body>
</html>
