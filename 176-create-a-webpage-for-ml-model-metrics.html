<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ML Model Metrics</title>
<style>
body{margin:0;background:#ecfeff;font-family:Arial;color:#164e63}
header{background:#0e7490;color:white;text-align:center;padding:25px}
.container{max-width:800px;margin:40px auto}
.metric{background:white;padding:20px;margin:15px 0;border-radius:12px;box-shadow:0 4px 12px #0002}
.metric span{float:right;font-weight:bold;color:#0284c7}
</style>
</head>
<body>
<header><h1>🏛️ ML Model Metrics</h1></header>
<div class="container">
<div class="metric">Accuracy <span>95%</span></div>
<div class="metric">Precision <span>93%</span></div>
<div class="metric">Recall <span>91%</span></div>
<div class="metric">F1 Score <span>92%</span></div>
<div class="metric">Loss <span>0.08</span></div>
</div>
</body>
</html>
