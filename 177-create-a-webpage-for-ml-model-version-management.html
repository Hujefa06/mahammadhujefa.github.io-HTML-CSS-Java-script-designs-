<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Model Version Management</title>
<style>
body{margin:0;background:#e8f8ff;font-family:Arial;color:#164e63}
header{background:#0369a1;color:white;text-align:center;padding:25px}
.container{max-width:850px;margin:40px auto;background:white;padding:25px;border-radius:16px;box-shadow:0 4px 15px #0002}
.version{display:grid;grid-template-columns:1fr 1fr 1fr;padding:18px;border-bottom:1px solid #bae6fd}
.active{color:#059669;font-weight:bold}
</style>
</head>
<body>
<header><h1>🏛️ Model Versions</h1></header>
<div class="container">
<h2>Ocean Prediction Model</h2>
<div class="version"><b>Version</b><b>Date</b><b>Status</b></div>
<div class="version"><span>v3.0</span><span>20 Sep</span><span class="active">Active</span></div>
<div class="version"><span>v2.5</span><span>10 Sep</span><span>Archived</span></div>
<div class="version"><span>v2.0</span><span>01 Sep</span><span>Archived</span></div>
</div>
</body>
</html>
