<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI Spending Limits</title>
<style>
body{margin:0;background:#e0f2fe;font-family:Arial;color:#164e63}
header{background:#075985;color:white;text-align:center;padding:25px}
.card{max-width:650px;margin:50px auto;background:white;padding:30px;border-radius:16px;box-shadow:0 5px 18px #0002}
.row{display:flex;justify-content:space-between;padding:20px 0;border-bottom:1px solid #bae6fd}
input{width:100px;padding:9px;border:1px solid #7dd3fc;border-radius:7px}
button{margin-top:20px;padding:11px 22px;border:0;border-radius:8px;background:#0284c7;color:white}
</style>
</head>
<body>
<header><h1>🏛️ AI Spending Limits</h1></header>
<div class="card">
<h2>Usage Controls</h2>
<div class="row"><span>Monthly Limit</span><input value="500"></div>
<div class="row"><span>Daily Limit</span><input value="50"></div>
<div class="row"><span>Alert Threshold</span><input value="80"></div>
<button>Save Limits</button>
</div>
</body>
</html>
