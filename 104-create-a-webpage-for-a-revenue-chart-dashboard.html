<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taj Mahal - Revenue Chart</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #e3f8fc;
}

header {
    background: #075985;
    color: white;
    padding: 20px;
}

.chart {
    width: 80%;
    max-width: 800px;
    height: 350px;
    margin: 40px auto;
    padding: 25px;
    background: white;
    border-radius: 15px;
    box-shadow: 0 5px 15px #9bcbd5;
    display: flex;
    align-items: end;
    justify-content: space-around;
}

.bar {
    width: 60px;
    background: #0e7490;
    border-radius: 8px 8px 0 0;
}

.jan { height: 100px; }
.feb { height: 160px; }
.mar { height: 130px; }
.apr { height: 220px; }
.may { height: 280px; }
</style>
</head>

<body>
<header>
    <h1>Taj Mahal Revenue Chart</h1>
</header>

<div class="chart">
    <div class="bar jan"></div>
    <div class="bar feb"></div>
    <div class="bar mar"></div>
    <div class="bar apr"></div>
    <div class="bar may"></div>
</div>
</body>
</html>
