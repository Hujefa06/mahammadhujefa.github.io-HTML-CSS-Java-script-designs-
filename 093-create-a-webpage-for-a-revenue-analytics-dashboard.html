<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taj Mahal - Revenue Analytics</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #e4f8fc;
}

header {
    background: #075985;
    color: white;
    padding: 20px;
}

.container {
    padding: 25px;
}

.revenue {
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 5px 15px #9bcbd5;
}

.amount {
    font-size: 38px;
    color: #087f8c;
    font-weight: bold;
}

.graph {
    display: flex;
    align-items: end;
    gap: 15px;
    height: 180px;
    margin-top: 25px;
}

.column {
    width: 45px;
    background: #0e7490;
    border-radius: 5px 5px 0 0;
}

.c1 { height: 60px; }
.c2 { height: 100px; }
.c3 { height: 80px; }
.c4 { height: 140px; }
.c5 { height: 120px; }
</style>
</head>

<body>
<header>
    <h1>Taj Mahal Revenue Analytics</h1>
</header>

<div class="container">
    <div class="revenue">
        <h2>Total Revenue</h2>
        <div class="amount">₹8,40,000</div>

        <div class="graph">
            <div class="column c1"></div>
            <div class="column c2"></div>
            <div class="column c3"></div>
            <div class="column c4"></div>
            <div class="column c5"></div>
        </div>
    </div>
</div>
</body>
</html>
