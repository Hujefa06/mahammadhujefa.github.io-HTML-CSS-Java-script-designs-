<!DOCTYPE html>
<html>
<head>

.settings{max-width:700px;margin:auto;background:white;padding:30px;border-radius:16px}
.row{padding:18px 0;border-bottom:1px solid #c5e2e9;display:flex;justify-content:space-between;gap:20px}
input{padding:10px;border:1px solid #9bcbd8;border-radius:7px}

@media(max-width:550px){.row{flex-direction:column}}
</style>
</head>

<body>

<div class="settings">

<h1>⚙️ Account Settings</h1>

<div class="row">

</div>

<div class="row">
<div><strong>Email</strong><p>explorer@kumari.com</p></div>
<button>Edit</button>
</div>

<div class="row">
<div><strong>Password</strong><p>••••••••</p></div>

</div>

</div>

</body>
</html>
