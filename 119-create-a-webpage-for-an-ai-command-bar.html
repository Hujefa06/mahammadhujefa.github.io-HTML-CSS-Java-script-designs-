<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taj Mahal - AI Command Bar</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #dff6ff;
}

.command {
    width: 600px;
    max-width: 90%;
    margin: 100px auto;
    background: white;
    border-radius: 15px;
    box-shadow: 0 8px 25px #8bbdcc;
    overflow: hidden;
}

.search {
    padding: 20px;
    border-bottom: 1px solid #cce4e9;
}

input {
    width: 100%;
    box-sizing: border-box;
    padding: 14px;
    border: 2px solid #70aebe;
    border-radius: 9px;
    font-size: 16px;
}

.option {
    padding: 15px 20px;
    color: #164e63;
}

.option:hover {
    background: #e0f5f8;
}
</style>
</head>

<body>
<div class="command">
    <div class="search">
        <input type="text" placeholder="Ask Taj AI...">
    </div>

    <div class="option">⌘ Search ancient sites</div>
    <div class="option">⌘ Open research reports</div>
    <div class="option">⌘ Explore temple ruins</div>
</div>
</body>
</html>
