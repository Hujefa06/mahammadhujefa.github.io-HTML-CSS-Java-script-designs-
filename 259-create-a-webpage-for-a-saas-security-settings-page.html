<!DOCTYPE html>
<html>
<head>
<title>Taj Mahal - Security</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;padding:30px;font-family:Arial;background:#eaf8ff;color:#063b4c}
.security{max-width:700px;margin:auto}
.item{background:white;padding:22px;margin:15px 0;border-radius:14px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 12px #b5d9e5}
.badge{padding:7px 12px;border-radius:20px;background:#d5f2f5;color:#075b73}
@media(max-width:550px){.item{flex-direction:column;align-items:flex-start;gap:10px}}
</style>
</head>

<body>

<div class="security">

<h1>🔐 Security Settings</h1>

<div class="item">
<div><h3>Password</h3><p>Last changed recently</p></div>
<span class="badge">Protected</span>
</div>

<div class="item">
<div><h3>Two-Factor Authentication</h3><p>Extra account protection</p></div>
<span class="badge">Enabled</span>
</div>

<div class="item">
<div><h3>Login Alerts</h3><p>Receive security notifications</p></div>
<span class="badge">Enabled</span>
</div>

</div>

</body>
</html>
