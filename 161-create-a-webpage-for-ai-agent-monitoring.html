<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI Agent Monitoring</title>
<style>
body{margin:0;background:#e6f7ff;font-family:Arial;color:#164e63}
header{background:#0369a1;color:white;text-align:center;padding:25px}
.grid{max-width:950px;margin:40px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{background:white;padding:25px;border-radius:15px;box-shadow:0 4px 15px #0002}
.value{font-size:30px;font-weight:bold;color:#0284c7}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>🏛️ AI Agent Monitoring</h1></header>
<div class="grid">
<div class="card"><h3>Status</h3><div class="value">Active</div></div>
<div class="card"><h3>Tasks</h3><div class="value">128</div></div>
<div class="card"><h3>Success Rate</h3><div class="value">96%</div></div>
</div>
</body>
</html>
