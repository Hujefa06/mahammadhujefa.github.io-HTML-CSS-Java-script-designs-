<!DOCTYPE html>
<html>
<head>
<title>Taj Mahal - AI Notifications</title>

<style>
body{
    margin:0;
    padding:30px;
    font-family:Arial;
    background:#eaf8ff;
    color:#063b4c;
}

.center{
    max-width:500px;
    margin:auto;
}

.notification{
    background:white;
    padding:18px;
    margin:12px 0;
    border-radius:12px;
    box-shadow:0 4px 12px #b5d9e5;
    display:flex;
    gap:15px;
}

.icon{
    font-size:28px;
}

.unread{
    border-left:5px solid #075b73;
}
</style>
</head>

<body>

<div class="center">

<h1>🔔 AI Notifications</h1>

<div class="notification unread">
<div class="icon">🤖</div>
<div>
<strong>AI Insight</strong>
<p>New island activity detected.</p>
</div>
</div>

<div class="notification">
<div class="icon">📊</div>
<div>
<strong>Analytics</strong>
<p>Weekly report is ready.</p>
</div>
</div>

<div class="notification">
<div class="icon">🏛️</div>
<div>
<strong>Ocean Alert</strong>
<p>New exploration data available.</p>
</div>
</div>

</div>

</body>
</html>
