<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Taj Mahal - CSS 06</title>

    <style>

        body {
            font-family: Arial;
            background-color: #f0f9ff;
            text-align: center;
        }

        .box {
            padding: 20px;
            margin: 20px;
            background-color: white;
        }

        .solid {
            border: 4px solid #075985;
        }

        .dashed {
            border: 4px dashed #16a34a;
        }

        .dotted {
            border: 4px dotted #d97706;
        }

        .rounded {
            border: 4px solid #7c3aed;
            border-radius: 25px;
        }

        .circle {
            width: 150px;
            height: 150px;
            margin: 30px auto;
            border: 5px solid #0f766e;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

    </style>
</head>

<body>

    <h1>Taj Mahal</h1>

    <div class="box solid">Solid Border — Temple</div>

    <div class="box dashed">Dashed Border — Harbour</div>

    <div class="box dotted">Dotted Border — Ruins</div>

    <div class="box rounded">Rounded Border — Ancient Map</div>

    <div class="circle">
        Island
    </div>

</body>
</html>
