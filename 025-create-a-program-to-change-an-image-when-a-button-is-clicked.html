<!DOCTYPE html>
<html>
<head>
<title>Taj Mahal - Image Change</title>
<style>
body{margin:0;font-family:Arial;background:#eaf8ff;text-align:center;padding:40px;color:#063b4c}
.card{max-width:600px;margin:auto;background:white;padding:30px;border-radius:16px;box-shadow:0 5px 15px #b5d9e5}
img{width:300px;height:200px;object-fit:cover;border-radius:12px}
button{margin-top:15px;padding:12px 25px;background:#075b73;color:white;border:0;border-radius:8px}
</style>
</head>
<body>

<div class="card">
<h1>🏛️ Island Explorer</h1>

<img id="islandImage"
src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=600&q=80">

<br>

<button onclick="changeImage()">Change View</button>
</div>

<script>
function changeImage() {
    document.getElementById("islandImage").src =
        "https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=600&q=80";
}
</script>

</body>
</html>
