<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taj Mahal - CSS 25</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f9ff;
            text-align: center;
            padding: 50px;
        }

        h1 {
            color: #075985;
        }

        .temple {
            width: 300px;
            margin: 60px auto;
            padding: 40px;
            background: #bae6fd;

            border: 3px solid #075985;

            outline: 6px dashed #d97706;
            outline-offset: 15px;
        }

        .ruins {
            width: 300px;
            margin: 70px auto;
            padding: 30px;
            background: #bbf7d0;

            outline: 8px dotted #15803d;
            outline-offset: 10px;
        }
    </style>
</head>

<body>

    <h1>TAJ MAHAL</h1>

    <div class="temple">
        <h2>Ancient Temple</h2>
        <p>Dashed outline with offset.</p>
    </div>

    <div class="ruins">
        <h2>Ivory Marble Dome</h2>
        <p>Dotted outline with offset.</p>
    </div>

</body>
</html>
