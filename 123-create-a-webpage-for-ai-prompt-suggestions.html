<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taj Mahal - Prompt Suggestions</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #e3f8fc;
}

.container {
    width: 650px;
    max-width: 90%;
    margin: 60px auto;
}

h1 {
    color: #075985;
}

.suggestions {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.prompt {
    background: white;
    padding: 20px;
    border-radius: 12px;
    border: 1px solid #b8dbe2;
    box-shadow: 0 4px 12px #b5d7de;
}

.prompt:hover {
    border-color: #087f8c;
    transform: translateY(-3px);
}

@media(max-width:600px) {
    .suggestions {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="container">
    <h1>AI Prompt Suggestions</h1>

    <div class="suggestions">
        <div class="prompt">Explore ancient cities</div>
        <div class="prompt">Describe temple ruins</div>
        <div class="prompt">Summarize archaeological records</div>
        <div class="prompt">Find research topics</div>
    </div>
</div>

</body>
</html>
