<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taj Mahal - CSS 26</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #e0f2fe;
            text-align: center;
        }

        h1 {
            color: #075985;
        }

        .container {
            margin: 40px;
            padding: 30px;
            background: white;
        }

        .box {
            margin: 20px;
            padding: 25px;
            background: #bae6fd;
            border: 3px solid #075985;
        }

        .small-spacing {
            margin: 10px;
            padding: 10px;
            background: #bbf7d0;
        }

        .large-spacing {
            margin: 40px;
            padding: 35px;
            background: #fef3c7;
        }
    </style>
</head>

<body>

    <h1>TAJ MAHAL</h1>

    <div class="container">

        <div class="box">
            Margin: 20px | Padding: 25px
        </div>

        <div class="small-spacing">
            Small Spacing
        </div>

        <div class="large-spacing">
            Large Spacing
        </div>

    </div>

</body>
</html>
