<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taj Mahal - AI Agent Profile</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #e3f8fc;
}

.profile {
    width: 450px;
    max-width: 90%;
    margin: 60px auto;
    padding: 30px;
    background: white;
    border-radius: 15px;
    text-align: center;
    box-shadow: 0 7px 20px #9bcbd5;
}

.avatar {
    width: 90px;
    height: 90px;
    margin: auto;
    border-radius: 50%;
    background: #075985;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 35px;
}

h1 {
    color: #075985;
}

.role {
    color: #087f8c;
    font-weight: bold;
}

.info {
    margin-top: 20px;
    padding: 15px;
    background: #e6f7fa;
    border-radius: 10px;
}
</style>
</head>

<body>

<div class="profile">

    <div class="avatar">AI</div>

    <h1>Research Agent</h1>
    <div class="role">AI Research Assistant</div>

    <div class="info">
        <p>Tasks completed: 248</p>
        <p>Status: Active</p>
        <p>Accuracy: 94%</p>
    </div>

</div>

</body>
</html>
