<!DOCTYPE html>
<html>
<head>
<title>Taj Mahal - Objects</title>
<style>
body{margin:0;font-family:Arial;background:#eaf8ff;color:#063b4c;text-align:center;padding:50px}
.card{max-width:500px;margin:auto;background:white;padding:35px;border-radius:16px;box-shadow:0 5px 15px #b5d9e5}
h1{color:#075b73}
.info{font-size:20px;padding:10px}
</style>
</head>
<body>

<div class="card">
<h1>🏛️ Explorer Profile</h1>
<div class="info" id="name"></div>
<div class="info" id="age"></div>
<div class="info" id="course"></div>
</div>

<script>
let explorer = {
    name: "Meena",
    age: 20,
    course: "Data Science"
};

document.getElementById("name").textContent =
    "Name: " + explorer.name;

document.getElementById("age").textContent =
    "Age: " + explorer.age;

document.getElementById("course").textContent =
    "Course: " + explorer.course;
</script>

</body>
</html>
