<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taj Mahal - Execution History</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #dff6ff;
}

.history {
    width: 800px;
    max-width: 90%;
    margin: 40px auto;
}

h1 {
    color: #075985;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    box-shadow: 0 5px 15px #9bcbd5;
    border-radius: 10px;
    overflow: hidden;
}

th, td {
    padding: 15px;
    border-bottom: 1px solid #d4e9ed;
    text-align: left;
}

th {
    background: #075985;
    color: white;
}

.success {
    color: #15803d;
    font-weight: bold;
}

.failed {
    color: #dc2626;
    font-weight: bold;
}

@media(max-width:650px) {
    table {
        font-size: 13px;
    }
}
</style>
</head>

<body>

<div class="history">
    <h1>AI Agent Execution History</h1>

    <table>
        <tr>
            <th>Task</th>
            <th>Agent</th>
            <th>Time</th>
            <th>Status</th>
        </tr>

        <tr>
            <td>Site Analysis</td>
            <td>Research Agent</td>
            <td>10:42</td>
            <td class="success">Success</td>
        </tr>

        <tr>
            <td>Data Processing</td>
            <td>Data Agent</td>
            <td>10:47</td>
            <td class="success">Success</td>
        </tr>

        <tr>
            <td>Report Generation</td>
            <td>Report Agent</td>
            <td>10:51</td>
            <td class="failed">Failed</td>
        </tr>
    </table>
</div>

</body>
</html>
