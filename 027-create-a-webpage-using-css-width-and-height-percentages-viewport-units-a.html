<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Taj Mahal - CSS 27</title>

    <style>
        html {
            font-size: 16px;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #e0f2fe;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            color: #075985;
        }

        .percentage {
            width: 70%;
            height: 30%;
            min-height: 120px;
            margin: 20px auto;
            padding: 20px;
            background: #bae6fd;
        }

        .viewport {
            width: 70vw;
            height: 25vh;
            margin: 20px auto;
            background: #bbf7d0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .rem-box {
            width: 20rem;
            padding: 2rem;
            margin: 20px auto;
            background: #fef3c7;
            font-size: 1.2rem;
        }
    </style>
</head>

<body>

    <h1>TAJ MAHAL</h1>

    <div class="percentage">
        Width using percentage
    </div>

    <div class="viewport">
        Width: 70vw | Height: 25vh
    </div>

    <div class="rem-box">
        Size using rem units
    </div>

</body>
</html>
