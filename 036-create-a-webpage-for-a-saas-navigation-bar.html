<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Taj Mahal - CSS 36</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #f0f9ff;
        }

        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #075985;
            padding: 18px 40px;
            color: white;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .links {
            display: flex;
            gap: 25px;
        }

        .links a {
            color: white;
            text-decoration: none;
            padding: 8px 12px;
        }

        .links a:hover {
            background: #0e7490;
            border-radius: 6px;
        }

        main {
            text-align: center;
            padding: 80px;
        }
    </style>
</head>

<body>

    <nav>

        <div class="logo">
            TAJ MAHAL
        </div>

        <div class="links">
            <a href="#">Home</a>
            <a href="#">Cities</a>
            <a href="#">Temples</a>
            <a href="#">Ruins</a>
        </div>

    </nav>

    <main>

        <h1>Ancient Land Explorer</h1>

        <p>Explore the lost southern shores.</p>

    </main>

</body>
</html>
