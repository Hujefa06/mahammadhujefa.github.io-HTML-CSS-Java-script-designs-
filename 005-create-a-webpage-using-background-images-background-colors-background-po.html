<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Taj Mahal - CSS 05</title>

    <style>

        body {
            margin: 0;
            font-family: Arial;
            background-color: #082f49;

            background-image:
                url("../assets/images/city-of-taj-mahal.png");

            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            background-attachment: fixed;
        }

        .content {
            min-height: 100vh;
            background-color: rgba(0, 30, 50, 0.75);
            color: white;
            text-align: center;
            padding-top: 150px;
        }

        h1 {
            font-size: 50px;
        }

    </style>
</head>

<body>

    <div class="content">

        <h1>TAJ MAHAL</h1>

        <p>
            A forgotten land on the banks of the sacred Yamuna.
        </p>

    </div>

</body>
</html>
