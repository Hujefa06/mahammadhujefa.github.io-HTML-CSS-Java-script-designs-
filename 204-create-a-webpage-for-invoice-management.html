<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Invoice Management</title>
<style>
body{margin:0;background:#e8f8ff;font-family:Arial;color:#164e63}
header{background:#075985;color:white;text-align:center;padding:25px}
table{width:90%;max-width:950px;margin:40px auto;background:white;border-collapse:collapse;box-shadow:0 4px 15px #0002}
th,td{padding:16px;border-bottom:1px solid #bae6fd;text-align:left}
th{background:#e0f2fe}
.paid{color:#059669;font-weight:bold}
button{padding:8px 15px;background:#0284c7;color:white;border:0;border-radius:7px}
</style>
</head>
<body>
<header><h1>🏛️ Invoice Management</h1></header>
<table>
<tr><th>Invoice</th><th>Date</th><th>Amount</th><th>Status</th><th>Action</th></tr>
<tr><td>#INV-101</td><td>20 Sep 2026</td><td>₹999</td><td class="paid">Paid</td><td><button>View</button></td></tr>
<tr><td>#INV-100</td><td>20 Aug 2026</td><td>₹999</td><td class="paid">Paid</td><td><button>View</button></td></tr>
<tr><td>#INV-099</td><td>20 Jul 2026</td><td>₹499</td><td class="paid">Paid</td><td><button>View</button></td></tr>
</table>
</body>
</html>
