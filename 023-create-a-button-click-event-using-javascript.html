<!DOCTYPE html>
<html>
<head>
<title>Taj Mahal - Button Click</title>
<style>
body{margin:0;font-family:Arial;background:#eaf8ff;text-align:center;padding:50px;color:#063b4c}
.card{max-width:500px;margin:auto;background:white;padding:35px;border-radius:16px;box-shadow:0 5px 15px #b5d9e5}
button{padding:14px 28px;background:#075b73;color:white;border:0;border-radius:8px;cursor:pointer}
#result{font-size:22px;font-weight:bold;color:#075b73}
</style>
</head>
<body>

<div class="card">
<h1>🧭 Island Button</h1>

<button onclick="showMessage()">Click Me</button>

<p id="result"></p>
</div>

<script>
function showMessage() {
    document.getElementById("result").textContent =
        "You discovered the island!";
}
</script>

</body>
</html>
