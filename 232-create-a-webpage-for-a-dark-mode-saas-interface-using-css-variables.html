<!DOCTYPE html>
<html>
<head>
<title>Taj Mahal - Dark Mode</title>

<style>
:root{
--bg:#eaf8ff;
--card:#ffffff;
--text:#063b4c;
--primary:#075b73;
}

body.dark{
--bg:#071b24;
--card:#102d38;
--text:#d9f7ff;
--primary:#1686a5;
}

body{
margin:0;
font-family:Arial;
background:var(--bg);
color:var(--text);
padding:30px;
transition:.3s;
}

header{
background:var(--primary);
color:white;
padding:20px;
border-radius:15px;
text-align:center;
}

.card{
background:var(--card);
padding:25px;
margin-top:20px;
border-radius:15px;
}

button{
padding:12px 20px;
border:0;
border-radius:8px;
background:var(--primary);
color:white;
cursor:pointer;
}
</style>
</head>

<body>

<header>
<h1>🏛️ Taj Mahal</h1>
<button onclick="document.body.classList.toggle('dark')">
Toggle Theme
</button>
</header>

<div class="card">
<h2>Island Dashboard</h2>
<p>CSS variables control the light and dark themes.</p>
</div>

</body>
</html>
