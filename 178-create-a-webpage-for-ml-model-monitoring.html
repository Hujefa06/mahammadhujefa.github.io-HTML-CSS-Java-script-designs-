<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ML Model Monitoring</title>
<style>
body{margin:0;background:#effcff;font-family:Arial;color:#164e63}
header{background:#075985;color:white;text-align:center;padding:25px}
.dashboard{max-width:900px;margin:40px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{background:white;padding:25px;border-radius:15px;box-shadow:0 4px 15px #0002}
.status{color:#059669;font-weight:bold;font-size:22px}
@media(max-width:700px){.dashboard{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>🏛️ ML Model Monitoring</h1></header>
<div class="dashboard">
<div class="card"><h3>Model Status</h3><div class="status">● Healthy</div></div>
<div class="card"><h3>Predictions</h3><h2>12,450</h2></div>
<div class="card"><h3>Accuracy</h3><h2>95.2%</h2></div>
</div>
</body>
</html>
