<!DOCTYPE html>
<html>
<head>
    <title>Taj Mahal - Factorial</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #eaf8ff;
            color: #063b4c;
            text-align: center;
            padding: 50px;
        }

        .card {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 5px 15px #b5d9e5;
        }

        h1 {
            color: #075b73;
        }

        #result {
            font-size: 25px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="card">
    <h1>🧮 Island Factorial</h1>
    <p>Number: 5</p>
    <p id="result"></p>
</div>

<script>
    let number = 5;
    let factorial = 1;

    for (let i = 1; i <= number; i++) {
        factorial *= i;
    }

    document.getElementById("result").textContent =
        "Factorial of " + number + " = " + factorial;
</script>

</body>
</html>
