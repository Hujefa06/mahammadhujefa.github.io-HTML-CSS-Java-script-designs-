<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Feature Importance</title>
<style>
body{margin:0;background:#ecfeff;font-family:Arial;color:#164e63}
header{background:#0e7490;color:white;text-align:center;padding:25px}
.chart{max-width:800px;margin:40px auto;background:white;padding:30px;border-radius:16px;box-shadow:0 4px 15px #0002}
.item{margin:20px 0}
.bar{height:25px;background:#dbeafe;border-radius:8px}
.fill{height:100%;background:#0284c7;border-radius:8px}
.a{width:90%}.b{width:72%}.c{width:55%}.d{width:35%}
</style>
</head>
<body>
<header><h1>🏛️ Feature Importance</h1></header>
<div class="chart">
<div class="item">Temperature<div class="bar"><div class="fill a"></div></div></div>
<div class="item">Humidity<div class="bar"><div class="fill b"></div></div></div>
<div class="item">Pressure<div class="bar"><div class="fill c"></div></div></div>
<div class="item">Wind Speed<div class="bar"><div class="fill d"></div></div></div>
</div>
</body>
</html>
