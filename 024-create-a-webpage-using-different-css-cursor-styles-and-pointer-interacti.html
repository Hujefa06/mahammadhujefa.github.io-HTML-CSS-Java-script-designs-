<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taj Mahal - CSS 24</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #ecfeff;
            text-align: center;
        }

        h1 {
            color: #075985;
        }

        .cursor-box {
            display: inline-block;
            width: 180px;
            padding: 30px 10px;
            margin: 10px;
            background: #bae6fd;
            border: 2px solid #075985;
        }

        .pointer {
            cursor: pointer;
        }

        .crosshair {
            cursor: crosshair;
        }

        .move {
            cursor: move;
        }

        .wait {
            cursor: wait;
        }

        .not-allowed {
            cursor: not-allowed;
        }

        .zoom {
            cursor: zoom-in;
        }
    </style>
</head>

<body>

    <h1>TAJ MAHAL</h1>

    <h2>CSS Cursor Styles</h2>

    <div class="cursor-box pointer">Pointer</div>
    <div class="cursor-box crosshair">Crosshair</div>
    <div class="cursor-box move">Move</div>
    <div class="cursor-box wait">Wait</div>
    <div class="cursor-box not-allowed">Not Allowed</div>
    <div class="cursor-box zoom">Zoom In</div>

</body>
</html>
