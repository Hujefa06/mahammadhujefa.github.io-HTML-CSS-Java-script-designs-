<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Security Settings</title>
<style>
body{margin:0;background:#effcff;font-family:Arial;color:#164e63}
header{background:#0369a1;color:white;text-align:center;padding:25px}
.box{max-width:750px;margin:45px auto;background:white;padding:30px;border-radius:16px;box-shadow:0 4px 15px #0002}
.row{display:flex;justify-content:space-between;align-items:center;padding:20px 0;border-bottom:1px solid #bae6fd}
.status{color:#059669;font-weight:bold}
button{padding:9px 18px;border:0;border-radius:7px;background:#0284c7;color:white}
</style>
</head>
<body>
<header><h1>🏛️ Security Settings</h1></header>
<div class="box">
<h2>Security Controls</h2>
<div class="row"><span>Password</span><button>Change Password</button></div>
<div class="row"><span>Two-Factor Authentication</span><span class="status">Enabled</span></div>
<div class="row"><span>Login Alerts</span><span class="status">Enabled</span></div>
<div class="row"><span>Security Status</span><span class="status">Protected</span></div>
</div>
</body>
</html>
