<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Integrations Management</title>
<style>
body{margin:0;background:#e8f8ff;font-family:Arial;color:#164e63}
header{background:#075985;color:white;text-align:center;padding:25px}
.grid{max-width:850px;margin:40px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{background:white;padding:25px;text-align:center;border-radius:15px;box-shadow:0 4px 15px #0002}
.icon{font-size:40px}
button{padding:9px 18px;background:#0284c7;color:white;border:0;border-radius:7px}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>🏛️ Integrations</h1></header>
<div class="grid">
<div class="card"><div class="icon">📊</div><h3>Analytics</h3><p>Connected</p><button>Manage</button></div>
<div class="card"><div class="icon">☁️</div><h3>Cloud Storage</h3><p>Connected</p><button>Manage</button></div>
<div class="card"><div class="icon">🔗</div><h3>Web Services</h3><p>Not Connected</p><button>Connect</button></div>
</div>
</body>
</html>
