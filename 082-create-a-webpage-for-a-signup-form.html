<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taj Mahal - Signup</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #e5f9ff;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.signup {
    width: 350px;
    padding: 30px;
    background: white;
    border-radius: 15px;
    box-shadow: 0 8px 25px #8abecb;
}

h1 {
    text-align: center;
    color: #075985;
}

input {
    width: 100%;
    padding: 11px;
    margin: 9px 0;
    box-sizing: border-box;
    border: 1px solid #70aebe;
    border-radius: 7px;
}

button {
    width: 100%;
    padding: 11px;
    background: #087f8c;
    color: white;
    border: none;
    border-radius: 7px;
}
</style>
</head>

<body>
<div class="signup">
    <h1>Join Taj Mahal</h1>
    <input type="text" placeholder="Full Name">
    <input type="email" placeholder="Email">
    <input type="password" placeholder="Password">
    <input type="password" placeholder="Confirm Password">
    <button>SIGN UP</button>
</div>
</body>
</html>
